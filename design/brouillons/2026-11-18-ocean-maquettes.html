<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquettes Océan</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#06162e}canvas{display:block;width:390px;height:844px}</style></head>
<body><canvas id="cv"></canvas>
<script>
/* Maquettes du Monde 4 « L'Océan » : la même mer, de la côte vers le large, du matin vers la nuit.
   Signature : « la mer vivante » — ce qui nage sous la surface se devine par transparence. Doré réservé aux gains. */
const Q = new URLSearchParams(location.search), Z = +(Q.get('z') || 1), FIX = Q.get('t');
const W = 390, H = 844, TAU = Math.PI * 2, DPR = 2, HZ = 560, SEA = 800;
const cv = document.getElementById('cv'); cv.width = W * DPR; cv.height = H * DPR;
const c = cv.getContext('2d');
const h1 = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
const lg = (y0, y1, st) => { const g = c.createLinearGradient(0, y0, 0, y1); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; };

const ZONES = {
  1: { name: 'Le Lagon', levels: 'Niveaux 1 à 3', sky: [[0, '#4fb8ee'], [.55, '#aee4f6'], [1, '#fff1d6']], sun: [74, 150, 34, '#fff7d8'], sea: ['#7fe6e0', '#2fc0cc', '#1394b8'], rim: '#ffffff', cloud: '#ffffff', cloudSh: '#a9c8ea', ink: '#0d3550', night: 0 },
  2: { name: 'Le Grand Large', levels: 'Niveaux 4 à 6', sky: [[0, '#3a7fd0'], [.5, '#8fc6ee'], [.85, '#ffd9a8'], [1, '#ffc488']], sun: [80, 330, 40, '#ffe6b0'], sea: ['#6fb0dc', '#2a78c0', '#11498a'], rim: '#ffe8c8', cloud: '#fff4e8', cloudSh: '#b8a6c8', ink: '#0d3550', night: 0 },
  3: { name: 'La Fosse', levels: 'Niveaux 7 à 10', sky: [[0, '#070b26'], [.55, '#18245e'], [1, '#2e3a7a']], sun: [76, 170, 26, '#eef4ff'], sea: ['#1c3a6a', '#0c2448', '#050f26'], rim: '#9ab4ff', cloud: '#3a4680', cloudSh: '#141c44', ink: '#eef4ff', night: 1 },
};
const ZN = ZONES[Z];

function cumulus(x, y, s, seed, o = {}) {
  const n = 6, P = []; for (let i = 0; i < n; i++) { const k = i / (n - 1) - .5; P.push([x + k * 120 * s, y - (1 - Math.abs(k) * 1.7) * 34 * s * (.7 + h1(seed + i) * .6), (26 + h1(seed * 3 + i) * 22) * s * (1 - Math.abs(k) * .6)]); }
  const base = o.base || ZN.cloud, sh = o.sh || ZN.cloudSh;
  c.save(); c.globalAlpha *= o.a == null ? 1 : o.a;
  c.fillStyle = rgba(sh, .5); for (const [px, py, r] of P) { c.beginPath(); c.arc(px + 4 * s, py + 6 * s, r, 0, TAU); c.fill(); }
  const g = c.createLinearGradient(x - 60 * s, y - 70 * s, x + 40 * s, y + 14 * s); g.addColorStop(0, ZN.rim); g.addColorStop(.4, base); g.addColorStop(1, mix(base, sh, .45)); c.fillStyle = g;
  for (const [px, py, r] of P) { c.beginPath(); c.arc(px, py, r, 0, TAU); c.fill(); } c.beginPath(); c.roundRect(x - 64 * s, y - 16 * s, 128 * s, 26 * s, 13 * s); c.fill();
  c.strokeStyle = rgba(ZN.rim, .8); c.lineWidth = 1.6 * s; for (const [px, py, r] of P) { c.beginPath(); c.arc(px, py, r - .8 * s, Math.PI * 1.05, Math.PI * 1.55); c.stroke(); }
  c.restore();
}
function sky(t) {
  c.fillStyle = lg(0, HZ, ZN.sky); c.fillRect(0, 0, W, HZ + 2);
  if (ZN.night) for (let i = 0; i < 70; i++) { c.fillStyle = `rgba(255,255,255,${(.3 + .5 * Math.abs(Math.sin(t * .02 + i))).toFixed(3)})`; c.beginPath(); c.arc(h1(i) * W, h1(i * 3) * HZ * .8, .6 + h1(i * 5) * 1.2, 0, TAU); c.fill(); }
  const [sx, sy, sr, sc] = ZN.sun;
  const g = c.createRadialGradient(sx, sy, sr * .4, sx, sy, sr * 6); g.addColorStop(0, rgba(sc, .7)); g.addColorStop(.3, rgba(sc, .2)); g.addColorStop(1, rgba(sc, 0)); c.fillStyle = g; c.fillRect(0, 0, W, HZ);
  c.fillStyle = sc; c.beginPath(); c.arc(sx, sy, sr, 0, TAU); c.fill();
  if (ZN.night) { c.fillStyle = 'rgba(150,165,210,0.35)'; for (const [dx, dy, r] of [[-7, -5, 5], [6, 4, 7], [-2, 10, 3]]) { c.beginPath(); c.arc(sx + dx, sy + dy, r, 0, TAU); c.fill(); } }
}
/* la mer en perspective : vagues plus petites à l'horizon, reflet du soleil/de la lune */
function sea(t) {
  const [a, b, d] = ZN.sea;
  c.fillStyle = lg(HZ, H, [[0, a], [.35, b], [1, d]]); c.fillRect(0, HZ, W, H - HZ);
  c.fillStyle = rgba('#ffffff', ZN.night ? .15 : .55); c.fillRect(0, HZ, W, 1.5);
  // chemin de lumière
  const sx = ZN.sun[0];
  for (let i = 0; i < 40; i++) { const k = i / 40, y = HZ + 4 + k * k * (H - HZ), w = 10 + k * 90, x = sx + (h1(i) - .5) * w + Math.sin(t * .05 + i) * 4 * k;
    c.fillStyle = rgba(ZN.night ? '#cfe0ff' : '#fff6d8', (.75 - k * .5) * (.5 + .5 * Math.sin(t * .09 + i * 2))); c.fillRect(x - (3 + k * 14) / 2, y, 3 + k * 14, 1.2 + k * 2); }
  // rides en perspective
  for (let i = 0; i < 46; i++) { const k = h1(i * 7), y = HZ + 6 + k * k * (H - HZ - 10), w = 6 + k * 40, x = (h1(i * 3) * (W + 80) + t * (.1 + k * .5)) % (W + 80) - 40;
    c.strokeStyle = ZN.night ? `rgba(110,240,255,${(.25 + k * .45).toFixed(3)})` : `rgba(255,255,255,${(.3 + k * .4).toFixed(3)})`; c.lineWidth = .8 + k * 1.6; c.beginPath(); c.moveTo(x - w / 2, y); c.quadraticCurveTo(x, y - 2 - k * 3, x + w / 2, y); c.stroke(); }
}
/* silhouettes sous l'eau (la signature) */
function under(f) { c.save(); c.beginPath(); c.rect(0, HZ + 2, W, H - HZ); c.clip(); f(); c.restore(); }
function turtle(x, y, s, t, a) { c.save(); c.translate(x, y); c.scale(s, s); c.rotate(Math.sin(t * .02) * .1); c.fillStyle = rgba('#0a5a5a', a);
  c.beginPath(); c.ellipse(0, 0, 16, 11, 0, 0, TAU); c.fill(); c.beginPath(); c.ellipse(19, 0, 6, 4.5, 0, 0, TAU); c.fill();
  const fl = Math.sin(t * .08) * .5; for (const [dx, dy, r] of [[8, -10, -.6 - fl], [8, 10, .6 + fl], [-11, -8, -1], [-11, 8, 1]]) { c.save(); c.translate(dx, dy); c.rotate(r); c.beginPath(); c.ellipse(0, 0, 8, 3, 0, 0, TAU); c.fill(); c.restore(); }
  c.fillStyle = rgba('#7af0d8', a * .5); c.beginPath(); c.ellipse(-2, -2, 9, 5, 0, 0, TAU); c.fill(); c.restore(); }
function coral(x, y, s, col, a) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = rgba(col, a);
  for (const [dx, dy, r] of [[0, 0, 10], [-9, 3, 7], [9, 2, 8], [-4, -7, 6], [5, -8, 5]]) { c.beginPath(); c.arc(dx, dy, r, 0, TAU); c.fill(); } c.restore(); }
function whaleShadow(x, y, s, a) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = rgba('#062a50', a);
  c.beginPath(); c.moveTo(-90, 0); c.quadraticCurveTo(-60, -30, 20, -22); c.quadraticCurveTo(70, -14, 90, 0); c.quadraticCurveTo(70, 16, 10, 20); c.quadraticCurveTo(-50, 22, -90, 0); c.fill();
  c.beginPath(); c.moveTo(-86, 0); c.lineTo(-118, -16); c.lineTo(-108, 0); c.lineTo(-118, 16); c.closePath(); c.fill();
  c.beginPath(); c.ellipse(10, 22, 26, 6, .4, 0, TAU); c.fill(); c.restore(); }
function jelly(x, y, s, t, col) { y += Math.sin(t * .03 + x) * 6; c.save(); c.translate(x, y); c.scale(s, s);
  const g = c.createRadialGradient(0, 0, 2, 0, 0, 34); g.addColorStop(0, rgba(col, .5)); g.addColorStop(1, rgba(col, 0)); c.fillStyle = g; c.beginPath(); c.arc(0, 0, 34, 0, TAU); c.fill();
  c.fillStyle = rgba(col, .75); c.beginPath(); c.arc(0, 0, 11, Math.PI, TAU); c.quadraticCurveTo(0, 4, -11, 0); c.fill();
  c.strokeStyle = rgba(col, .6); c.lineWidth = 1.2; for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 4, 1); c.quadraticCurveTo(i * 4 + Math.sin(t * .1 + i) * 4, 10, i * 4, 20); c.stroke(); }
  c.restore(); }
function fishSchool(x, y, n, t, a) { c.fillStyle = rgba('#0a3a6a', a); for (let i = 0; i < n; i++) { const fx = x + Math.cos(i * 2.4 + t * .02) * (14 + i * 2), fy = y + Math.sin(i * 1.7 + t * .03) * 10; c.beginPath(); c.ellipse(fx, fy, 5, 2, 0, 0, TAU); c.fill(); c.beginPath(); c.moveTo(fx - 4, fy); c.lineTo(fx - 8, fy - 3); c.lineTo(fx - 8, fy + 3); c.fill(); } }
function island(x, y, s, t) { c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = '#f2dca8'; c.beginPath(); c.ellipse(0, 0, 90, 12, 0, Math.PI, TAU); c.fill();
  c.fillStyle = '#6cc46c'; c.beginPath(); c.ellipse(-10, -6, 60, 18, 0, Math.PI, TAU); c.fill(); c.fillStyle = 'rgba(255,255,255,0.25)'; c.beginPath(); c.ellipse(-26, -14, 26, 6, -.1, 0, TAU); c.fill();
  // palmiers
  for (const [px, h, sw] of [[-30, 44, -.2], [-8, 56, .15], [26, 40, .3]]) { c.strokeStyle = '#8a6a3a'; c.lineWidth = 3; c.beginPath(); c.moveTo(px, -12); c.quadraticCurveTo(px + sw * 20, -12 - h * .6, px + sw * 30, -12 - h); c.stroke();
    c.fillStyle = '#3fae5a'; const tx = px + sw * 30, ty = -12 - h; for (let i = 0; i < 5; i++) { const a = -Math.PI * .1 - i * .7 + Math.sin(t * .03) * .08; c.save(); c.translate(tx, ty); c.rotate(a); c.beginPath(); c.ellipse(13, 0, 14, 3.5, .25, 0, TAU); c.fill(); c.restore(); } }
  // phare (rappel de la bouée)
  c.save(); c.translate(56, -6); for (let i = 0; i < 4; i++) { c.fillStyle = i % 2 ? '#ffffff' : '#e8566a'; c.fillRect(-6 + i * .6, -14 - i * 12, 12 - i * 1.2, 12); }
  c.fillStyle = '#0d3550'; c.fillRect(-6, -66, 12, 6); c.fillStyle = '#fff4c0'; c.fillRect(-4, -64, 8, 3); c.fillStyle = '#e8566a'; c.beginPath(); c.moveTo(-7, -66); c.lineTo(0, -74); c.lineTo(7, -66); c.fill(); c.restore();
  // paillote
  c.fillStyle = '#c89a5a'; c.fillRect(-60, -24, 18, 14); c.fillStyle = '#e8c06a'; c.beginPath(); c.moveTo(-66, -22); c.lineTo(-51, -34); c.lineTo(-36, -22); c.fill();
  c.restore(); }
function sailboat(x, y, s, t, col) { y += Math.sin(t * .04 + x) * 1.5; c.save(); c.translate(x, y); c.scale(s, s); c.rotate(Math.sin(t * .035 + x) * .05);
  c.fillStyle = '#7a4a2a'; c.beginPath(); c.moveTo(-16, 0); c.lineTo(16, 0); c.lineTo(11, 6); c.lineTo(-11, 6); c.fill();
  c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(1, -2); c.lineTo(1, -34); c.lineTo(16, -4); c.fill(); c.fillStyle = col; c.beginPath(); c.moveTo(-1, -2); c.lineTo(-1, -28); c.lineTo(-14, -4); c.fill(); c.restore(); }
function whaleBack(x, y, s, t) { const q = (Math.sin(t * .01) + 1) / 2; c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = '#2a4a7a'; c.beginPath(); c.ellipse(0, 4, 46, 10 + q * 4, 0, Math.PI, TAU); c.fill(); c.fillStyle = 'rgba(255,255,255,0.25)'; c.beginPath(); c.ellipse(-12, -2 - q * 3, 20, 3, 0, 0, TAU); c.fill();
  // jet d'eau
  const k = (t * .02) % 1; if (k < .5) { const a = 1 - k * 2; c.fillStyle = `rgba(255,255,255,${(.8 * a).toFixed(3)})`; for (let i = 0; i < 7; i++) { const ang = -Math.PI / 2 + (i - 3) * .22; c.beginPath(); c.arc(-14 + Math.cos(ang) * k * 50, -10 + Math.sin(ang) * k * 60, 2.5, 0, TAU); c.fill(); } }
  c.restore(); }
function gulls(t) { c.strokeStyle = 'rgba(13,53,80,0.55)'; c.lineWidth = 1.6; c.lineCap = 'round'; for (let i = 0; i < 3; i++) { const x = (h1(i) * W + t * (.4 + i * .1)) % (W + 40) - 20, y = 240 + i * 40 + Math.sin(t * .03 + i) * 8, f = Math.sin(t * .2 + i) * 3;
  c.beginPath(); c.moveTo(x - 8, y - f); c.quadraticCurveTo(x - 3, y - 4, x, y); c.quadraticCurveTo(x + 3, y - 4, x + 8, y - f); c.stroke(); } }
function wreck(x, y, s) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#0a1830';
  c.beginPath(); c.moveTo(-40, 0); c.lineTo(-30, -12); c.lineTo(30, -16); c.lineTo(44, 0); c.fill(); c.fillRect(-4, -80, 4, 66); c.save(); c.translate(-2, -70); c.rotate(.25); c.fillRect(-24, -2, 48, 3); c.restore();
  c.fillStyle = 'rgba(160,190,255,0.3)'; c.beginPath(); c.moveTo(-1, -60); c.lineTo(20, -40); c.lineTo(-1, -30); c.fill(); c.restore(); }
function tentacle(x, y, s, t) { c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = '#3a1a4a'; c.lineCap = 'round';
  c.beginPath(); for (let i = 0; i <= 20; i++) { const u = i / 20, px = Math.sin(u * 3 + t * .02) * 20 * u, py = -u * 140; c.lineWidth = 22 * (1 - u) + 3; if (i) { c.lineTo(px, py); c.stroke(); c.beginPath(); } c.moveTo(px, py); }
  c.fillStyle = 'rgba(255,170,220,0.35)'; for (let i = 2; i < 18; i += 3) { const u = i / 20; c.beginPath(); c.arc(Math.sin(u * 3 + t * .02) * 20 * u + 6 * (1 - u), -u * 140, 3 * (1 - u) + 1, 0, TAU); c.fill(); }
  c.restore(); }


/* ===== faune détaillée, vue à travers l'eau ===== */
const deep = (col, d) => mix(col, ZN.sea[1], .25 + d * .45); /* teinte de profondeur */
function caustics(y0, y1, t, a) { c.save(); c.strokeStyle = `rgba(255,255,240,${a})`; c.lineWidth = 1.2;
  for (let j = 0; j < 9; j++) { const y = y0 + (y1 - y0) * j / 9; c.beginPath(); for (let x = -10; x <= W + 10; x += 10) { const v = y + Math.sin(x * .06 + t * .05 + j * 1.7) * 5 + Math.sin(x * .13 - t * .04 + j) * 3; x > -10 ? c.lineTo(x, v) : c.moveTo(x, v); } c.stroke(); }
  for (let j = 0; j < 12; j++) { const x = j * 36; c.beginPath(); for (let y = y0; y <= y1; y += 10) { const v = x + Math.sin(y * .07 + t * .045 + j * 2.1) * 8; y > y0 ? c.lineTo(v, y) : c.moveTo(v, y); } c.stroke(); }
  c.restore(); }
function turtle2(x, y, s, t, d, dir = 1) { c.save(); c.translate(x, y); c.scale(s * dir, s); c.rotate(Math.sin(t * .02) * .08); c.globalAlpha = .9;
  const sk = deep('#5aa86a', d), shell = deep('#3a7a4a', d), plate = deep('#6ab07a', d), dark = deep('#1e4a30', d);
  const fl = Math.sin(t * .07); /* nageoires qui battent */
  c.fillStyle = sk; for (const [dx, dy, r0, sw] of [[9, -10, -.7, fl], [9, 10, .7, -fl], [-12, -8, -1.1, -fl * .5], [-12, 8, 1.1, fl * .5]]) { c.save(); c.translate(dx, dy); c.rotate(r0 + sw * .45); c.beginPath(); c.ellipse(dy < 0 ? 0 : 0, 0, dx > 0 ? 11 : 6, dx > 0 ? 3.6 : 2.6, 0, 0, TAU); c.fill(); c.restore(); }
  c.beginPath(); c.ellipse(20, 0, 6.5, 5, 0, 0, TAU); c.fill(); /* tête */
  c.fillStyle = dark; c.beginPath(); c.arc(22.5, -1.8, 1.3, 0, TAU); c.fill();
  c.fillStyle = shell; c.beginPath(); c.ellipse(0, 0, 16, 12, 0, 0, TAU); c.fill();
  c.strokeStyle = dark; c.lineWidth = 1; c.fillStyle = plate;
  for (const [px, py, r] of [[0, 0, 5], [-8, -5, 3.8], [-8, 5, 3.8], [8, -5, 3.8], [8, 5, 3.8]]) { c.beginPath(); for (let k = 0; k < 6; k++) { const a = k / 6 * TAU; c.lineTo(px + Math.cos(a) * r, py + Math.sin(a) * r * .9); } c.closePath(); c.fill(); c.stroke(); }
  c.fillStyle = 'rgba(255,255,240,0.25)'; c.beginPath(); c.ellipse(-3, -5, 8, 3, -.2, 0, TAU); c.fill();
  c.restore(); }
function clown(x, y, s, t, d, dir = 1) { c.save(); c.translate(x, y); c.scale(s * dir, s); c.rotate(Math.sin(t * .1 + x) * .08);
  const o = deep('#ff7a2a', d), w = deep('#ffffff', d), k = deep('#1a1a2a', d);
  c.fillStyle = o; c.beginPath(); c.moveTo(-9, 0); c.lineTo(-15, -5 - Math.sin(t * .3) * 1.5); c.lineTo(-15, 5 + Math.sin(t * .3) * 1.5); c.closePath(); c.fill();
  c.beginPath(); c.ellipse(0, 0, 10, 6, 0, 0, TAU); c.fill();
  c.save(); c.clip(); c.fillStyle = w; for (const bx of [-5, 3]) c.fillRect(bx, -7, 3, 14); c.restore();
  c.strokeStyle = k; c.lineWidth = .8; c.beginPath(); c.ellipse(0, 0, 10, 6, 0, 0, TAU); c.stroke();
  c.fillStyle = k; c.beginPath(); c.arc(6, -1.5, 1.2, 0, TAU); c.fill(); c.restore(); }
function tang(x, y, s, t, d, dir = 1) { c.save(); c.translate(x, y); c.scale(s * dir, s); c.rotate(Math.sin(t * .08 + x) * .1);
  c.fillStyle = deep('#ffd23a', d); c.beginPath(); c.moveTo(-10, 0); c.lineTo(-17, -6); c.lineTo(-17, 6); c.closePath(); c.fill();
  c.fillStyle = deep('#2a7aff', d); c.beginPath(); c.ellipse(0, 0, 11, 7.5, 0, 0, TAU); c.fill();
  c.strokeStyle = deep('#0a2a6a', d); c.lineWidth = 1.6; c.beginPath(); c.moveTo(-7, -2); c.quadraticCurveTo(0, -6, 7, -3); c.stroke();
  c.fillStyle = deep('#0a1a3a', d); c.beginPath(); c.arc(7, -1.5, 1.3, 0, TAU); c.fill(); c.restore(); }
function yellowSchool(cx, cy, n, t, d) { for (let i = 0; i < n; i++) { const a = t * .02 + i * .9, x = cx + Math.cos(a + i) * (10 + (i % 4) * 6) + Math.sin(t * .01) * 30, y = cy + Math.sin(a * 1.3 + i) * 8;
  c.save(); c.translate(x, y); c.scale(Math.cos(t * .01) > 0 ? 1 : -1, 1); c.fillStyle = deep('#ffe24a', d); c.beginPath(); c.ellipse(0, 0, 4.5, 2.4, 0, 0, TAU); c.fill(); c.beginPath(); c.moveTo(-4, 0); c.lineTo(-7, -2.5); c.lineTo(-7, 2.5); c.fill(); c.restore(); } }
function baitBall(cx, cy, t) { for (let i = 0; i < 46; i++) { const a = t * .03 + i * 2.39, r = 6 + (i % 7) * 4.5, x = cx + Math.cos(a) * r * 1.6, y = cy + Math.sin(a) * r * .8;
  const sh = .4 + .6 * Math.abs(Math.sin(a * 2)); c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2); c.fillStyle = `rgba(${(200 + sh * 55) | 0},${(220 + sh * 35) | 0},255,${(.45 + sh * .4).toFixed(3)})`; c.beginPath(); c.ellipse(0, 0, 4, 1.4, 0, 0, TAU); c.fill(); c.restore(); } }

/* ===== zones ===== */
function zone1(t) {
  sky(t); cumulus(300, 210, 1.2, 7); cumulus(70, 290, .8, 3, { a: .9 }); gulls(t);
  sea(t);
  c.fillStyle = 'rgba(80,150,170,0.45)'; c.beginPath(); c.ellipse(60, HZ + 1, 50, 9, 0, Math.PI, TAU); c.fill(); c.beginPath(); c.ellipse(140, HZ + 1, 22, 5, 0, Math.PI, TAU); c.fill();
  island(285, HZ + 2, 1.25, t);
  under(() => { // lagon transparent : bancs de sable, coraux, tortues
    c.fillStyle = 'rgba(255,240,200,0.28)'; for (const [x, y, w] of [[90, 640, 90], [260, 700, 130], [60, 760, 120]]) { c.beginPath(); c.ellipse(x, y, w, w * .16, 0, 0, TAU); c.fill(); }
