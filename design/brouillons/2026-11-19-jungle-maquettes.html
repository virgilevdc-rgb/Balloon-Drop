<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquettes Jungle</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#06140e}canvas{display:block;width:390px;height:844px}</style></head>
<body><canvas id="cv"></canvas>
<script>
/* Monde 6 « La Jungle » : la même jungle, de plus en plus profonde.
   Signature : « la lumière qui filtre » — rayons dorés à travers les feuilles, poussière qui danse ; plus on avance, plus il fait sombre et plus il y a de lucioles. */
const Q = new URLSearchParams(location.search), Z = +(Q.get('z') || 1), FIX = Q.get('t');
const W = 390, H = 844, TAU = Math.PI * 2, DPR = 2, FL = 800;
const cv = document.getElementById('cv'); cv.width = W * DPR; cv.height = H * DPR; const c = cv.getContext('2d');
const h1 = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; };
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
const lg = (y0, y1, st) => { const g = c.createLinearGradient(0, y0, 0, y1); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const ZONES = {
  1: { name: 'La Lisière', levels: 'Niveaux 1 à 3', sky: [[0, '#fffbe2'], [.35, '#f4f2c0'], [.7, '#d6eaa4'], [1, '#b4d890']],
    P: ['#d4e6a6', '#a8d08a', '#6eae66', '#3a8a4a', '#16502e'], HI: ['#eef6c4', '#cfe8a0', '#a8dc7a', '#86d064', '#5aa848'], haze: '#f6f4cc',
    leaf: '#2f8a3e', leafL: '#8ee070', leafD: '#14532a', trunk: '#6a4a30', trunkL: '#a07a4c', light: '#fff4c0', water: ['#7ad8c0', '#2f9a84', '#145a50'], ink: '#123a24', night: 0 },
  2: { name: 'La Canopée', levels: 'Niveaux 4 à 6', sky: [[0, '#eef6f0'], [.5, '#d8ecdc'], [1, '#bcdcc4']],
    P: ['#cfe2d4', '#a6cbb2', '#6fa784', '#3d7c54', '#174a30'], HI: ['#e6f2e8', '#c4e0cc', '#9ccca8', '#7ac08a', '#4e9a62'], haze: '#eef6f0',
    leaf: '#3a9a48', leafL: '#9ae68a', leafD: '#1a5e30', trunk: '#5e4430', trunkL: '#927252', light: '#ffffff', water: ['#e6f2ea', '#c4e0cc', '#a0ccb0'], ink: '#123a24', night: 0 },
  3: { name: 'Le Temple perdu', levels: 'Niveaux 7 à 10', sky: [[0, '#0c2a30'], [.5, '#123c3c'], [1, '#164640']],
    P: ['#1f4c4a', '#183e3c', '#11302e', '#0a2420', '#041210'], HI: ['#2c6660', '#2a5e56', '#246050', '#1e6a4a', '#2a8a5a'], haze: '#2a6a5e',
    leaf: '#1e5a3e', leafL: '#4aa070', leafD: '#0a2a1e', trunk: '#2e2620', trunkL: '#4a3e30', light: '#c8ffe4', water: ['#1a4a48', '#0e3030', '#061c1c'], ink: '#eaffef', night: 1 },
};
const ZN = ZONES[Z];

/* ===== éléments ===== */
/* une feuille simple (lancéolée), nervure centrale, lumière en haut à gauche */
function leaf(x, y, len, w, a, col, colL, vein = true) { c.save(); c.translate(x, y); c.rotate(a);
  const g = c.createLinearGradient(0, -w, len * .3, w); g.addColorStop(0, colL); g.addColorStop(1, col); c.fillStyle = g;
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(len * .45, -w, len, 0); c.quadraticCurveTo(len * .45, w, 0, 0); c.fill();
  if (vein) { c.strokeStyle = 'rgba(0,30,10,0.25)'; c.lineWidth = Math.max(.6, w * .08); c.beginPath(); c.moveTo(0, 0); c.lineTo(len * .92, 0); c.stroke(); }
  c.restore(); }
/* feuille de monstera (grande, découpée) : dessinée une fois dans un petit canevas, les trous ne percent que la feuille */
const MON = {};
function monsteraImg(col, colL) { const k = col + colL; if (MON[k]) return MON[k];
  const cv2 = document.createElement('canvas'); cv2.width = 300; cv2.height = 260; const x = cv2.getContext('2d'); x.scale(2, 2); x.translate(75, 120);
  const g = x.createLinearGradient(-20, -60, 40, 40); g.addColorStop(0, colL); g.addColorStop(1, col); x.fillStyle = g;
  x.beginPath(); x.moveTo(0, 0); x.bezierCurveTo(-60, -10, -70, -90, 0, -110); x.bezierCurveTo(70, -90, 60, -10, 0, 0); x.fill();
  x.globalCompositeOperation = 'destination-out';
  for (const sd of [-1, 1]) for (let k2 = 0; k2 < 4; k2++) { const yy = -24 - k2 * 20; x.beginPath(); x.moveTo(sd * 70, yy - 6); x.quadraticCurveTo(sd * 30, yy + 2, sd * 8, yy - 4 - k2 * 2); x.quadraticCurveTo(sd * 30, yy + 8, sd * 70, yy + 6); x.fill();
    if (k2 < 3) { x.beginPath(); x.ellipse(sd * 22, yy - 12, 4, 6, sd * .4, 0, TAU); x.fill(); } }
  x.globalCompositeOperation = 'source-over';
  x.strokeStyle = 'rgba(0,30,10,0.3)'; x.lineWidth = 2.4; x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(4, -50, 0, -104); x.stroke();
  x.strokeStyle = 'rgba(255,255,255,0.18)'; x.lineWidth = 2; x.beginPath(); x.moveTo(-6, -20); x.quadraticCurveTo(-30, -60, -8, -98); x.stroke();
  return MON[k] = cv2; }
function monstera(x, y, s, a, col, colL) { c.save(); c.translate(x, y); c.rotate(a); c.scale(s, s);
  c.strokeStyle = mix(col, '#000000', .3); c.lineWidth = 4; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-6, 30, 4, 70); c.stroke();
  c.drawImage(monsteraImg(col, colL), -75, -120, 150, 130); c.restore(); }
/* feuille de bananier (longue, déchirée) */
function banana(x, y, s, a, col, colL) { c.save(); c.translate(x, y); c.rotate(a); c.scale(s, s);
  c.strokeStyle = mix(col, '#000000', .25); c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(60, -30, 140, -10); c.stroke();
  for (let i = 0; i < 12; i++) { const u = i / 12, px = u * 136, py = -30 * Math.sin(u * Math.PI * .9) * 1 + u * 10 - 4, l = 34 * Math.sin((u * .9 + .1) * Math.PI);
    for (const sd of [-1, 1]) { const g = c.createLinearGradient(px, py, px + 8, py + sd * l); g.addColorStop(0, sd < 0 ? colL : col); g.addColorStop(1, sd < 0 ? col : mix(col, '#000000', .2)); c.fillStyle = g;
      c.beginPath(); c.moveTo(px, py); c.lineTo(px + 13, py + 2); c.lineTo(px + 6 + sd * 3, py + sd * l); c.lineTo(px - 2 + sd * 2, py + sd * l * .96); c.closePath(); c.fill(); } }
  c.restore(); }
/* touffe de fougère */
function fern(x, y, s, col, colL, flip = 1) { c.save(); c.translate(x, y); c.scale(s * flip, s);
  for (let f = 0; f < 5; f++) { const a = -Math.PI / 2 + (f - 2) * .42; c.save(); c.rotate(a + Math.PI / 2);
    c.strokeStyle = col; c.lineWidth = 1.6; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(8, -30, 4, -62); c.stroke();
    for (let i = 1; i < 12; i++) { const u = i / 12, py = -u * 60, px = Math.sin(u * 2) * 6, l = 14 * (1 - u * .8); leaf(px, py, l, 2.6, -2.4 + u * .3, col, colL, false); leaf(px, py, l, 2.6, -.7 - u * .3, col, colL, false); }
    c.restore(); }
  c.restore(); }
/* liane qui pend (courbe + feuilles) */
function vine(x, y0, len, sway, t, col, colL, n = 9) { const ph = h1(x) * 6, sw = Math.sin(t * .015 + ph) * sway;
  const pt = u => [x + Math.sin(u * 2.4 + ph) * 6 + sw * u * u, y0 + u * len];
  c.strokeStyle = mix(col, '#000000', .3); c.lineWidth = 2.2; c.beginPath(); for (let i = 0; i <= 20; i++) { const [px, py] = pt(i / 20); i ? c.lineTo(px, py) : c.moveTo(px, py); } c.stroke();
  for (let i = 1; i <= n; i++) { const u = i / (n + .5), [px, py] = pt(u); leaf(px, py, 13 - u * 3, 4.4, (i % 2 ? .5 : 2.6) + sw * .01, col, colL); } }
/* tronc géant avec racines contreforts */
function trunk(x, w, top, bot, col, colL, dark) { const g = c.createLinearGradient(x - w, 0, x + w, 0); g.addColorStop(0, colL); g.addColorStop(.35, col); g.addColorStop(1, dark);
  c.fillStyle = g; c.beginPath(); c.moveTo(x - w * .5, top); c.lineTo(x + w * .5, top); c.quadraticCurveTo(x + w * .45, bot - 80, x + w * 1.4, bot); c.lineTo(x - w * 1.4, bot); c.quadraticCurveTo(x - w * .45, bot - 80, x - w * .5, top); c.fill();
  /* racines contreforts */ for (const [dx, h] of [[-1, 60], [1, 50], [-.4, 34]]) { c.fillStyle = dx < 0 ? colL : dark; c.beginPath(); c.moveTo(x + dx * w * .3, bot - h); c.quadraticCurveTo(x + dx * w * .9, bot - h * .3, x + dx * w * 1.9, bot); c.lineTo(x + dx * w * 1.2, bot); c.quadraticCurveTo(x + dx * w * .6, bot - h * .2, x + dx * w * .2, bot - h * .6); c.fill(); }
  c.strokeStyle = 'rgba(0,0,0,0.18)'; c.lineWidth = 1.5; for (let i = 0; i < 6; i++) { const xx = x - w * .35 + i * w * .14; c.beginPath(); c.moveTo(xx, top); c.quadraticCurveTo(xx + 3, (top + bot) / 2, xx - 2, bot - 30); c.stroke(); }
  /* mousse */ c.fillStyle = 'rgba(120,200,90,0.35)'; for (let i = 0; i < 5; i++) { c.beginPath(); c.ellipse(x - w * .45, top + 40 + i * (bot - top) / 6, 4, 12, 0, 0, TAU); c.fill(); } }
/* masse de feuillage (canopée) : grappes de feuilles qui se recouvrent */
function canopy(y, h, col, colL, colD, seed, dens = 1) { c.fillStyle = colD; c.fillRect(0, y - h, W, h);
  for (let r = 0; r < 3; r++) for (let i = 0; i < 18 * dens; i++) { const x = h1(seed + i * 3 + r * 50) * (W + 60) - 30, yy = y - h * (1 - r * .3) + h1(seed + i * 7 + r) * h * .5;
    for (let k = 0; k < 7; k++) { const a = h1(seed + i + k * 11) * TAU; leaf(x + Math.cos(a) * 10, yy + Math.sin(a) * 6, 22 + h1(i + k) * 14, 7, a, r === 2 ? col : mix(col, colD, .4), r === 2 ? colL : col); } } }
/* rayons de lumière qui filtrent (signature) */
function rays(t, a, x0 = 40) { c.save(); for (let i = 0; i < 6; i++) { const x = x0 + i * 62 + Math.sin(t * .006 + i) * 10, w = 18 + h1(i) * 26, al = a * (.45 + .4 * Math.sin(t * .01 + i * 1.7));
    const g = c.createLinearGradient(x, 0, x + 180, H); g.addColorStop(0, rgba(ZN.light, al)); g.addColorStop(.7, rgba(ZN.light, al * .35)); g.addColorStop(1, rgba(ZN.light, 0));
    c.fillStyle = g; c.beginPath(); c.moveTo(x, -10); c.lineTo(x + w, -10); c.lineTo(x + w + 200, H); c.lineTo(x + 170, H); c.fill(); } c.restore(); }
function motes(t, n, col, a) { for (let i = 0; i < n; i++) { const x = (h1(i * 5) * W + Math.sin(t * .01 + i) * 14 + t * .05) % W, y = (h1(i * 9) * H * .9 + Math.cos(t * .008 + i) * 10) % H, tw = .4 + .6 * Math.abs(Math.sin(t * .03 + i));
  c.fillStyle = rgba(col, a * tw); c.beginPath(); c.arc(x, y, .8 + h1(i) * 1.4, 0, TAU); c.fill(); } }
/* cascade au loin */
function waterfall(x, top, bot, w, t) { const g = c.createLinearGradient(x - w, 0, x + w, 0); g.addColorStop(0, 'rgba(220,250,255,0.75)'); g.addColorStop(.5, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(170,225,235,0.8)');
  c.fillStyle = g; c.beginPath(); c.moveTo(x - w * .6, top); c.lineTo(x + w * .6, top); c.lineTo(x + w, bot); c.lineTo(x - w, bot); c.fill();
  c.strokeStyle = 'rgba(150,210,220,0.5)'; c.lineWidth = 1.2; for (let i = 0; i < 7; i++) { const xx = x - w * .5 + i * w / 6, o = (t * 1.5 + i * 23) % 40; for (let y = top - 40 + o; y < bot; y += 40) { c.beginPath(); c.moveTo(xx, Math.max(top, y)); c.lineTo(xx + (xx - x) * .05, Math.min(bot, y + 18)); c.stroke(); } }
  for (let i = 0; i < 9; i++) { const q = ((t * .01 + i / 9) % 1); c.fillStyle = `rgba(255,255,255,${(.6 * (1 - q)).toFixed(3)})`; c.beginPath(); c.arc(x + (h1(i) - .5) * w * 3, bot - q * 22, 4 + q * 10, 0, TAU); c.fill(); } }
/* ara (perroquet) perché */
function macaw(x, y, s, t, col = '#e8302a', dir = 1) { const bob = Math.sin(t * .05 + x) * 1; c.save(); c.translate(x, y + bob); c.scale(s * dir, s);
  c.fillStyle = '#2a7aff'; c.beginPath(); c.moveTo(-2, 8); c.lineTo(-10, 38); c.lineTo(-4, 40); c.lineTo(3, 10); c.fill();
  c.fillStyle = col; c.beginPath(); c.moveTo(0, 6); c.lineTo(-7, 34); c.lineTo(-2, 35); c.lineTo(4, 8); c.fill();
  c.fillStyle = col; c.beginPath(); c.ellipse(0, 0, 7, 10, -.2, 0, TAU); c.fill();
  c.fillStyle = '#ffd23a'; c.beginPath(); c.ellipse(-3, 2, 5, 7, -.3, 0, TAU); c.fill(); c.fillStyle = '#2a7aff'; c.beginPath(); c.ellipse(-4, 6, 4, 5, -.3, 0, TAU); c.fill();
  c.fillStyle = col; c.beginPath(); c.arc(3, -10, 6, 0, TAU); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.ellipse(5, -10, 3, 3.4, 0, 0, TAU); c.fill(); c.fillStyle = '#1a1a2a'; c.beginPath(); c.arc(5.6, -10, 1.3, 0, TAU); c.fill();
  c.fillStyle = '#f3ead8'; c.beginPath(); c.moveTo(7, -9); c.quadraticCurveTo(14, -9, 12, -3); c.quadraticCurveTo(10, -5, 7, -5); c.fill(); c.fillStyle = '#2a2a3a'; c.beginPath(); c.moveTo(7, -5); c.quadraticCurveTo(10, -4, 10, -1); c.lineTo(7, -3); c.fill();
  c.strokeStyle = '#3a3a4a'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(-1, 9); c.lineTo(-2, 13); c.moveTo(2, 9); c.lineTo(2, 13); c.stroke(); c.restore(); }
/* toucan */
function toucan(x, y, s, t, dir = 1) { c.save(); c.translate(x, y + Math.sin(t * .04) * 1); c.scale(s * dir, s);
  c.fillStyle = '#141a22'; c.beginPath(); c.ellipse(0, 0, 9, 13, -.15, 0, TAU); c.fill(); c.beginPath(); c.moveTo(-3, 10); c.lineTo(-8, 26); c.lineTo(-2, 24); c.lineTo(3, 11); c.fill();
  c.fillStyle = '#fff6d0'; c.beginPath(); c.ellipse(4, -7, 6, 7, 0, 0, TAU); c.fill(); c.fillStyle = '#141a22'; c.beginPath(); c.arc(2, -15, 7, 0, TAU); c.fill();
  c.fillStyle = '#7ad8ff'; c.beginPath(); c.arc(5, -15, 3, 0, TAU); c.fill(); c.fillStyle = '#141a22'; c.beginPath(); c.arc(5.5, -15, 1.3, 0, TAU); c.fill();
  const g = c.createLinearGradient(8, -20, 30, -10); g.addColorStop(0, '#ffcf3a'); g.addColorStop(.6, '#ff8a2a'); g.addColorStop(1, '#e8302a'); c.fillStyle = g;
  c.beginPath(); c.moveTo(7, -19); c.quadraticCurveTo(30, -22, 34, -12); c.quadraticCurveTo(24, -9, 8, -11); c.fill(); c.fillStyle = 'rgba(0,0,0,0.25)'; c.beginPath(); c.moveTo(8, -12); c.quadraticCurveTo(24, -10, 34, -12); c.quadraticCurveTo(22, -7, 8, -9); c.fill(); c.restore(); }
/* papillon morpho */
function butterfly(x, y, s, t, col = '#2a9aff') { const f = Math.abs(Math.sin(t * .35 + x)); c.save(); c.translate(x, y); c.scale(s, s);
  for (const sd of [-1, 1]) { c.save(); c.scale(sd * (.25 + f * .75), 1); const g = c.createRadialGradient(4, -3, 1, 6, -2, 10); g.addColorStop(0, '#bff4ff'); g.addColorStop(.5, col); g.addColorStop(1, '#0a2a5a'); c.fillStyle = g;
    c.beginPath(); c.ellipse(6, -4, 7, 6, -.3, 0, TAU); c.fill(); c.beginPath(); c.ellipse(5, 4, 4.5, 4, .4, 0, TAU); c.fill(); c.restore(); }
  c.fillStyle = '#1a1a2a'; c.fillRect(-.8, -6, 1.6, 12); c.restore(); }
/* luciole */
function fireflies(t, n, area) { for (let i = 0; i < n; i++) { const x = area[0] + h1(i * 3) * area[2] + Math.sin(t * .012 + i * 2) * 18, y = area[1] + h1(i * 7) * area[3] + Math.cos(t * .01 + i) * 14, a = Math.max(0, Math.sin(t * .04 + i * 1.3));
  const g = c.createRadialGradient(x, y, 0, x, y, 10); g.addColorStop(0, `rgba(220,255,140,${(.9 * a).toFixed(3)})`); g.addColorStop(1, 'rgba(180,255,120,0)'); c.fillStyle = g; c.beginPath(); c.arc(x, y, 10, 0, TAU); c.fill();
  c.fillStyle = `rgba(255,255,200,${a.toFixed(3)})`; c.beginPath(); c.arc(x, y, 1.6, 0, TAU); c.fill(); } }
/* brume */
function mist(y0, y1, col, a) { c.fillStyle = lg(y0, y1, [[0, rgba(col, 0)], [.5, rgba(col, a)], [1, rgba(col, 0)]]); c.fillRect(0, y0, W, y1 - y0); }
/* silhouettes de jungle lointaine (couches) */
function jungleLayer(y, amp, col, seed, bumps = 9) { c.fillStyle = col; c.beginPath(); c.moveTo(0, H); c.lineTo(0, y);
  for (let i = 0; i <= bumps; i++) { const x = i / bumps * W, r = (W / bumps) * (.55 + h1(seed + i) * .4); c.arc(x, y - amp * h1(seed * 3 + i), r * .7, Math.PI, TAU); }
  c.lineTo(W, H); c.fill(); }
/* rangée d'arbres : troncs fins + cimes en grappes de feuilles (lumière en haut à gauche) */
function treeline(y, col, colL, colD, seed, n, sz) { for (let i = 0; i < n; i++) { const x = (i + h1(seed + i) * .6) / n * (W + 60) - 30, hh = sz * (1.6 + h1(seed * 2 + i) * 1.4), top = y - hh;
    c.fillStyle = colD; c.fillRect(x - sz * .05, top, sz * .1, hh);
    for (let k = 0; k < 6; k++) { const bx = x + (h1(seed + i * 7 + k) - .5) * sz * 1.4, by = top + (h1(seed + i * 3 + k) - .4) * sz * .7, r = sz * (.35 + h1(i + k * 5) * .3);
      c.fillStyle = colD; c.beginPath(); c.arc(bx + r * .15, by + r * .15, r, 0, TAU); c.fill();
      const g = c.createRadialGradient(bx - r * .4, by - r * .4, r * .1, bx, by, r); g.addColorStop(0, colL); g.addColorStop(1, col); c.fillStyle = g; c.beginPath(); c.arc(bx, by, r * .92, 0, TAU); c.fill(); } }
  c.fillStyle = colD; c.fillRect(0, y - sz * .3, W, H - y + sz * .3); }
/* palmier */
function palm(x, y, h, s, t, col, colL, tr) { c.save(); c.translate(x, y); c.scale(s, s); const sw = Math.sin(t * .012 + x) * .04;
  c.strokeStyle = tr; c.lineWidth = 9; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-h * .25, -h * .5, h * .06, -h); c.stroke(); c.lineCap = 'butt';
  c.strokeStyle = 'rgba(0,0,0,0.2)'; c.lineWidth = 2; for (let k = 1; k < 10; k++) { const u = k / 10, px = -h * .25 * 2 * u * (1 - u) + h * .06 * u * u, py = -h * u; c.beginPath(); c.moveTo(px - 4, py); c.lineTo(px + 4, py + 2); c.stroke(); }
  c.translate(h * .06, -h); for (let f = 0; f < 7; f++) { const a = -Math.PI * .95 + f * .5 + sw; banana(0, 0, .55, a, f % 2 ? col : mix(col, '#000000', .15), colL); }
  c.fillStyle = '#6a4a2a'; for (const [dx, dy] of [[-4, 4], [3, 6], [0, 9]]) { c.beginPath(); c.arc(dx, dy, 4, 0, TAU); c.fill(); } c.restore(); }
/* héliconia : bractées rouges en zigzag */
function heliconia(x, y, s, sw = 0) { c.save(); c.translate(x, y); c.scale(s, s); c.rotate(sw);
  c.strokeStyle = '#2a6a2a'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(0, 40); c.lineTo(0, -36); c.stroke();
