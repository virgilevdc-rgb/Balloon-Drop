<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquettes Miroir</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#1a1030}canvas{display:block;width:390px;height:844px}</style></head>
<body><canvas id="cv"></canvas>
<script>
/* Monde 7 « Le Miroir » : deux directions à comparer. Le ballon part d'en bas et MONTE vers la plateforme du plafond. */
const Q = new URLSearchParams(location.search), V = Q.get('v') || 'A', FIX = Q.get('t');
const W = 390, H = 844, TAU = Math.PI * 2, DPR = 2;
const cv = document.getElementById('cv'); cv.width = W * DPR; cv.height = H * DPR; const c = cv.getContext('2d');
const h1 = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const lg = (y0, y1, st) => { const g = c.createLinearGradient(0, y0, 0, y1); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rgb = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };

/* ================= A : le monde à l'envers =================
   On dessine un paysage normal, puis on le retourne : le sol est au plafond, les maisons et les arbres pendent,
   la cascade REMONTE, les nuages et le soleil sont en bas. (La lumière est dessinée par en dessous pour être en haut à gauche une fois retournée.) */
function cloud(x, y, s, a) { c.save(); c.globalAlpha = a; c.fillStyle = '#ffffff'; for (const [dx, dy, r] of [[-30, 0, 20], [-8, -10, 26], [18, -4, 22], [38, 4, 16]]) { c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, TAU); c.fill(); }
  c.fillStyle = 'rgba(200,170,240,0.45)'; c.beginPath(); c.roundRect(x - 48 * s, y + 2 * s, 100 * s, 12 * s, 6 * s); c.fill(); c.restore(); }
function house(x, y, s, wall, roof) { c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = wall; c.fillRect(-20, -30, 40, 30); c.fillStyle = 'rgba(255,255,255,0.25)'; c.fillRect(-20, -30, 10, 30);
  c.fillStyle = roof; c.beginPath(); c.moveTo(-26, -28); c.lineTo(0, -52); c.lineTo(26, -28); c.fill(); c.fillStyle = 'rgba(255,255,255,0.25)'; c.beginPath(); c.moveTo(-26, -28); c.lineTo(0, -52); c.lineTo(-6, -30); c.fill();
  c.fillStyle = '#ffd86a'; c.fillRect(-12, -22, 9, 9); c.fillRect(4, -22, 9, 9); c.fillStyle = '#6a3a5a'; c.beginPath(); c.roundRect(-4, -14, 9, 14, [4, 4, 0, 0]); c.fill();
  c.fillStyle = '#8a6a8a'; c.fillRect(8, -50, 6, 12); c.restore(); }
function tree(x, y, s, col, hi) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#7a4a5a'; c.fillRect(-3, -24, 6, 24);
  for (const [dx, dy, r] of [[0, -40, 18], [-12, -30, 13], [12, -30, 13]]) { const g = c.createRadialGradient(dx - r * .3, dy + r * .4, 1, dx, dy, r); g.addColorStop(0, hi); g.addColorStop(1, col); c.fillStyle = g; c.beginPath(); c.arc(dx, dy, r, 0, TAU); c.fill(); } c.restore(); }
/* ================= Le Village renversé (v2) =================
   Tout est dessiné directement à l'envers (pas de retournement), pour garder la lumière du jeu en haut à gauche.
   Le sol est au plafond ; les montagnes pendent, pointes en bas (la neige est au bout) ; la cascade REMONTE ;
   le ciel est en dessous : nuages et soleil en bas. Le milieu reste calme pour le ballon. */
const GY = 112; /* bord du sol-plafond */
function skyV() { c.fillStyle = lg(GY, H, [[0, '#ffe4d6'], [.22, '#f6d2f0'], [.55, '#c8b4f6'], [.85, '#9a86ea'], [1, '#8a76e0']]); c.fillRect(0, 0, W, H);
  const g = c.createRadialGradient(292, 770, 10, 292, 770, 260); g.addColorStop(0, 'rgba(255,244,214,0.95)'); g.addColorStop(.25, 'rgba(255,220,236,0.45)'); g.addColorStop(1, 'rgba(255,220,236,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = '#fff6dc'; c.beginPath(); c.arc(292, 770, 36, 0, TAU); c.fill(); }
/* une chaîne de montagnes qui pend du plafond : pointes vers le bas, neige au bout, face éclairée à gauche */
function mountainsV(y0, col, sh, snow, seed, n, hmin, hmax, haze) {
  for (let i = 0; i < n; i++) { const cx = (i + .5 + (h1(seed + i) - .5) * .4) / n * (W + 60) - 30, hw = (W / n) * (.75 + h1(seed * 2 + i) * .35), tip = y0 + hmin + h1(seed * 3 + i) * (hmax - hmin), tx = cx + (h1(seed * 5 + i) - .5) * hw * .3;
    /* massif (ombre) : flancs légèrement creusés */
    c.fillStyle = sh; c.beginPath(); c.moveTo(cx - hw, y0); c.quadraticCurveTo(cx - hw * .45, y0 + (tip - y0) * .3, tx, tip); c.quadraticCurveTo(cx + hw * .45, y0 + (tip - y0) * .3, cx + hw, y0); c.closePath(); c.fill();
    /* face éclairée, à gauche (lumière en haut à gauche) */
    c.fillStyle = col; c.beginPath(); c.moveTo(cx - hw, y0); c.quadraticCurveTo(cx - hw * .45, y0 + (tip - y0) * .3, tx, tip); c.quadraticCurveTo(tx - hw * .05, y0 + (tip - y0) * .55, cx - hw * .15, y0); c.closePath(); c.fill();
    /* petite calotte de neige au bout (le sommet est en bas) */
    const sk = .2, sy = tip - (tip - y0) * sk; c.fillStyle = snow; c.beginPath(); c.moveTo(tx, tip);
    c.quadraticCurveTo(tx - hw * .12, sy + (tip - sy) * .3, tx - hw * .16, sy); c.lineTo(tx - hw * .08, sy + 6); c.lineTo(tx - hw * .02, sy - 3); c.lineTo(tx + hw * .05, sy + 7); c.lineTo(tx + hw * .13, sy); c.quadraticCurveTo(tx + hw * .1, sy + (tip - sy) * .3, tx, tip); c.fill();
    c.fillStyle = 'rgba(180,160,230,0.45)'; c.beginPath(); c.moveTo(tx, tip); c.lineTo(tx + hw * .13, sy); c.lineTo(tx + hw * .05, sy + 7); c.closePath(); c.fill(); }
  if (haze) { c.fillStyle = lg(y0, y0 + hmax + 260, [[0, 'rgba(255,228,214,0)'], [.45, `rgba(246,214,240,${haze})`], [.7, `rgba(236,208,244,${haze * .45})`], [1, 'rgba(230,206,246,0)']]); c.fillRect(0, y0, W, hmax + 260); } }
/* nuage renversé : base plate en haut, volutes en bas (lumière en haut à gauche) */
function cloudV(x, y, s, a, t, col = '#ffffff', shade = 'rgba(210,190,250,0.55)') { c.save(); c.globalAlpha = a; const P = [[-46, 6, 18], [-22, 14, 26], [6, 18, 30], [34, 12, 22], [54, 4, 15]];
  c.fillStyle = 'rgba(150,120,220,0.35)'; for (const [dx, dy, r] of P) { c.beginPath(); c.arc(x + dx * s + 3 * s, y + dy * s + 5 * s, r * s, 0, TAU); c.fill(); }
  c.fillStyle = col; for (const [dx, dy, r] of P) { c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, TAU); c.fill(); } c.beginPath(); c.roundRect(x - 60 * s, y - 6 * s, 128 * s, 16 * s, 8 * s); c.fill();
  c.fillStyle = shade; for (const [dx, dy, r] of P) { c.beginPath(); c.arc(x + dx * s + r * s * .25, y + dy * s + r * s * .3, r * s * .7, 0, Math.PI); c.fill(); } c.restore(); }
/* maison accrochée au plafond (toit vers le bas) */
function houseV(x, s, wall, roof, t, light) { c.save(); c.translate(x, GY); c.scale(s, s);
  c.fillStyle = 'rgba(80,40,120,0.18)'; c.fillRect(-18, 0, 40, 4);
  c.fillStyle = wall; c.beginPath(); c.roundRect(-20, 0, 40, 32, 3); c.fill(); c.fillStyle = 'rgba(255,255,255,0.28)'; c.fillRect(-20, 0, 9, 32);
  c.fillStyle = roof; c.beginPath(); c.moveTo(-27, 30); c.lineTo(0, 56); c.lineTo(27, 30); c.closePath(); c.fill(); c.fillStyle = 'rgba(255,255,255,0.3)'; c.beginPath(); c.moveTo(-27, 30); c.lineTo(0, 56); c.lineTo(-7, 32); c.fill();
  c.fillStyle = light ? '#ffe08a' : '#f6e6ff'; c.beginPath(); c.roundRect(-13, 9, 9, 10, 2); c.fill(); c.beginPath(); c.roundRect(4, 9, 9, 10, 2); c.fill();
  c.fillStyle = '#7a4a8a'; c.beginPath(); c.roundRect(-4, 0, 9, 13, [0, 0, 4, 4]); c.fill();
  /* cheminée et fumée qui « tombe » */ c.fillStyle = '#a07aa0'; c.fillRect(10, 36, 6, 14); for (let i = 0; i < 4; i++) { const q = ((t * .008 + i / 4) % 1); c.fillStyle = `rgba(255,255,255,${(.55 * (1 - q)).toFixed(3)})`; c.beginPath(); c.arc(13 + Math.sin(q * 6) * 4, 52 + q * 40, 3 + q * 7, 0, TAU); c.fill(); }
  c.restore(); }
function treeV(x, s, col, hi) { c.save(); c.translate(x, GY); c.scale(s, s); c.fillStyle = '#8a5a6a'; c.fillRect(-2.5, 0, 5, 18);
  for (const [dx, dy, r] of [[0, 34, 16], [-11, 24, 12], [11, 24, 12]]) { const g = c.createRadialGradient(dx - r * .4, dy - r * .4, 1, dx, dy, r); g.addColorStop(0, hi); g.addColorStop(1, col); c.fillStyle = g; c.beginPath(); c.arc(dx, dy, r, 0, TAU); c.fill(); } c.restore(); }
function birdV(x, y, s, t, ph) { const f = Math.sin(t * .22 + ph) * 4; c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = 'rgba(90,60,150,0.75)'; c.lineWidth = 2.2; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-9, -f); c.quadraticCurveTo(-4, 4, 0, 1); c.quadraticCurveTo(4, 4, 9, -f); c.stroke(); c.restore(); }
function zoneA(t) {
  skyV();
  /* les montagnes renversées au fond (deux plans), très douces */
  mountainsV(GY - 4, '#eee2fc', '#dccaf6', '#ffffff', 7, 3, 230, 300, .45);
  mountainsV(GY - 4, '#d8c6f8', '#bfa8ee', '#fbf6ff', 21, 4, 110, 170, 0);
  /* falaise qui pend à droite, cascade qui remonte de son bord jusqu'au lac du plafond */
  const cx = 316; c.fillStyle = '#a890e0'; c.beginPath(); c.moveTo(cx - 44, GY); c.lineTo(cx - 40, 270); c.quadraticCurveTo(cx - 4, 300, cx + 46, 282); c.lineTo(cx + 54, GY); c.fill();
  c.fillStyle = '#c0aaf0'; c.beginPath(); c.moveTo(cx - 44, GY); c.lineTo(cx - 40, 270); c.quadraticCurveTo(cx - 26, 282, cx - 14, 286); c.lineTo(cx - 20, GY); c.fill();
  for (const [x, y] of [[cx - 30, 280], [cx + 30, 284]]) { c.fillStyle = '#7ad07a'; for (let k = 0; k < 4; k++) { c.beginPath(); c.ellipse(x + (k - 1.5) * 7, y + 3, 4, 7, (k - 1.5) * .3, 0, TAU); c.fill(); } }
  const wtop = GY + 2, wbot = 286, wx = cx + 4; const wg = c.createLinearGradient(wx - 14, 0, wx + 14, 0); wg.addColorStop(0, 'rgba(205,240,255,0.9)'); wg.addColorStop(.45, '#ffffff'); wg.addColorStop(1, 'rgba(170,220,255,0.9)');
  c.fillStyle = wg; c.beginPath(); c.moveTo(wx - 15, wtop); c.lineTo(wx + 15, wtop); c.lineTo(wx + 10, wbot); c.lineTo(wx - 10, wbot); c.fill();
  c.strokeStyle = 'rgba(140,200,240,0.55)'; c.lineWidth = 1.6; c.lineCap = 'round'; for (let i = 0; i < 5; i++) { const xx = wx - 7 + i * 3.5, o = (t * 2.2 + i * 11) % 34; for (let y = wbot + 34 - o; y > wtop; y -= 34) { c.beginPath(); c.moveTo(xx, Math.min(wbot, y)); c.lineTo(xx, Math.max(wtop, y - 15)); c.stroke(); } } /* les traits montent */
  for (let i = 0; i < 8; i++) { const q = ((t * .012 + i / 8) % 1); c.fillStyle = `rgba(230,248,255,${(.85 * (1 - q)).toFixed(3)})`; c.beginPath(); c.ellipse(wx + (h1(i) - .5) * 24, wbot - 6 - q * 70, 1.8, 3.2, 0, 0, TAU); c.fill(); } /* gouttes qui s'échappent vers le haut */
  for (let i = 0; i < 6; i++) { const q = ((t * .02 + i / 6) % 1); c.fillStyle = `rgba(255,255,255,${(.7 * (1 - q)).toFixed(3)})`; c.beginPath(); c.arc(wx + (h1(i * 3) - .5) * 44, GY + 6 + q * 18, 3 + q * 5, 0, TAU); c.fill(); } /* écume au lac */
  /* le sol-plafond : herbe qui pend, lac, bord lumineux */
  c.fillStyle = lg(0, GY + 10, [[0, '#3a7a5a'], [.6, '#5ab86a'], [1, '#8ae47e']]); c.beginPath(); c.moveTo(0, 0); c.lineTo(W, 0); c.lineTo(W, GY); for (let x = W; x >= 0; x -= 8) c.lineTo(x, GY + Math.sin(x * .05) * 2.5 + (x % 16 ? 4 : 0)); c.lineTo(0, GY); c.closePath(); c.fill();
  /* petites fleurs qui pendent au bord */ for (let i = 0; i < 12; i++) { const x = 12 + i * 33 + h1(i) * 10; if (Math.abs(x - 320) < 50) continue; c.fillStyle = ['#ff8ab0', '#ffffff', '#ffd86a'][i % 3]; c.beginPath(); c.arc(x, GY + 6, 2.6, 0, TAU); c.fill(); }
  c.fillStyle = '#9af08a'; c.fillRect(0, GY - 6, W, 3);
  c.fillStyle = '#8ad8f4'; c.beginPath(); c.ellipse(wx, GY - 1, 46, 6, 0, 0, Math.PI); c.fill();
  /* les maisons et les arbres pendent */
  treeV(24, .9, '#4aa860', '#a6ec8a'); houseV(70, 1.12, '#ffc4d4', '#a04a8a', t, true); treeV(118, .75, '#58b86a', '#b4f29a'); houseV(160, .92, '#fff0b8', '#6a5ad8', t + 60, false); treeV(206, 1, '#4aa860', '#a6ec8a'); treeV(372, .8, '#58b86a', '#b4f29a');
  /* un habitant qui se promène la tête en bas */ { const x = 238 + Math.sin(t * .008) * 14, sw = Math.sin(t * .2) * 2; c.fillStyle = '#ff7a8a'; c.beginPath(); c.roundRect(x - 4, GY + 6, 8, 11, 3); c.fill(); c.fillStyle = '#ffd8b8'; c.beginPath(); c.arc(x, GY + 21, 4.6, 0, TAU); c.fill(); c.fillStyle = '#4a2a6a'; c.fillRect(x - 3 + sw * .5, GY, 2, 6); c.fillRect(x + 1 - sw * .5, GY, 2, 6); }
  /* oiseaux qui volent sur le dos, au milieu */ for (let i = 0; i < 3; i++) { const x = ((h1(i * 4) * W + t * .45 * (1 + i * .3)) % (W + 60)) - 30; birdV(x, 400 + i * 30 + Math.sin(t * .02 + i) * 6, 1 - i * .12, t, i); }
  /* les nuages en bas (le ciel est sous nos pieds) */ for (const [x, y, s, a] of [[60, 690, 1.05, .95], [230, 724, .9, .9], [350, 668, .6, .85], [150, 784, 1.25, 1], [330, 806, 1.1, 1]]) cloudV(x + Math.sin(t * .006 + x) * 8, y, s, a, t);
  /* la plateforme pend sous les maisons, au bout de deux cordes */ const px = 150; c.strokeStyle = '#8a5a6a'; c.lineWidth = 2; c.beginPath(); c.moveTo(px - 16, GY + 52); c.lineTo(px - 16, 190); c.moveTo(px + 16, GY + 52); c.lineTo(px + 16, 190); c.stroke(); plat(px, 192); }

/* ================= Zone 2 : la Forêt suspendue (fin d'après-midi) ================= */
function pineV(x, s, col, hi, dark) { c.save(); c.translate(x, GY); c.scale(s, s); c.fillStyle = '#7a4a5a'; c.fillRect(-3, 0, 6, 26);
  for (let k = 0; k < 4; k++) { const y = 14 + k * 20, w = 30 - k * 5; c.fillStyle = dark; c.beginPath(); c.moveTo(-w, y); c.lineTo(w, y); c.lineTo(0, y + 34); c.closePath(); c.fill();
    c.fillStyle = col; c.beginPath(); c.moveTo(-w, y); c.lineTo(w * .1, y); c.lineTo(0, y + 34); c.closePath(); c.fill();
    c.fillStyle = hi; c.beginPath(); c.moveTo(-w, y); c.lineTo(-w * .4, y); c.lineTo(-w * .1, y + 14); c.closePath(); c.fill(); } c.restore(); }
function mushV(x, s, cap) { c.save(); c.translate(x, GY); c.scale(s, s); c.fillStyle = '#fff2e0'; c.fillRect(-2.5, 0, 5, 14); c.fillStyle = cap; c.beginPath(); c.ellipse(0, 16, 11, 7, 0, 0, Math.PI); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.85)'; for (const [dx, dy] of [[-5, 18], [3, 20], [6, 17]]) { c.beginPath(); c.arc(dx, dy, 1.6, 0, TAU); c.fill(); } c.restore(); }
function lanternV(x, len, t, col) { const sw = Math.sin(t * .03 + x) * .12; c.save(); c.translate(x, GY); c.rotate(sw); c.strokeStyle = '#6a4a5a'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, len); c.stroke();
  const g = c.createRadialGradient(0, len + 8, 1, 0, len + 8, 24); g.addColorStop(0, rgb(col, .55)); g.addColorStop(1, rgb(col, 0)); c.fillStyle = g; c.beginPath(); c.arc(0, len + 8, 24, 0, TAU); c.fill();
  c.fillStyle = col; c.beginPath(); c.roundRect(-5, len, 10, 15, 4); c.fill(); c.fillStyle = 'rgba(255,255,255,0.5)'; c.fillRect(-3, len + 2, 2, 10); c.restore(); }
function leavesUp(t, n, cols) { for (let i = 0; i < n; i++) { const q = ((t * .0035 + h1(i * 3)) % 1), x = h1(i) * W + Math.sin(q * 10 + i) * 16, y = H - 120 - q * (H - 260), a = q * 8 + i;
  c.save(); c.globalAlpha = Math.sin(q * Math.PI); c.translate(x, y); c.rotate(a); c.fillStyle = cols[i % cols.length]; c.beginPath(); c.ellipse(0, 0, 6, 3, 0, 0, TAU); c.fill(); c.restore(); } }
function zoneF(t) {
  c.fillStyle = lg(GY, H, [[0, '#ffe2bc'], [.25, '#ffc8c0'], [.6, '#e8a6d8'], [.9, '#a882e0'], [1, '#9070d8']]); c.fillRect(0, 0, W, H);
  { const g = c.createRadialGradient(96, 760, 10, 96, 760, 280); g.addColorStop(0, 'rgba(255,214,150,0.95)'); g.addColorStop(.3, 'rgba(255,190,170,0.45)'); g.addColorStop(1, 'rgba(255,190,170,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); c.fillStyle = '#ffe6b0'; c.beginPath(); c.arc(96, 772, 40, 0, TAU); c.fill(); }
  mountainsV(GY - 4, '#f6d6ea', '#e6bcdc', '#fff8f2', 33, 3, 260, 320, .5);
  /* la forêt lointaine : rangée de sapins qui pendent, en silhouette rose */ for (let i = 0; i < 12; i++) { const x = i * 34 + h1(i) * 12, s = .9 + h1(i * 3) * .6; c.save(); c.translate(x, GY); c.scale(s, s); c.fillStyle = '#d8a0c8'; for (let k = 0; k < 4; k++) { const y = 10 + k * 18, w = 22 - k * 4; c.beginPath(); c.moveTo(-w, y); c.lineTo(w, y); c.lineTo(0, y + 30); c.fill(); } c.restore(); }
  /* la forêt proche */ pineV(26, 1.15, '#3fa060', '#8ae08a', '#2a7a4a'); pineV(96, .95, '#4aa868', '#9aea94', '#2f8050'); mushV(60, 1, '#ff6a8a'); pineV(178, 1.25, '#3fa060', '#8ae08a', '#2a7a4a'); mushV(214, .8, '#ffb02a');
  pineV(282, 1, '#4aa868', '#9aea94', '#2f8050'); pineV(352, 1.2, '#3fa060', '#8ae08a', '#2a7a4a'); mushV(318, .9, '#ff6a8a');
  /* le sol-plafond, mousse et fleurs */ c.fillStyle = lg(0, GY + 10, [[0, '#2a6a4a'], [.6, '#4aa060'], [1, '#7ad87a']]); c.beginPath(); c.moveTo(0, 0); c.lineTo(W, 0); c.lineTo(W, GY); for (let x = W; x >= 0; x -= 8) c.lineTo(x, GY + Math.sin(x * .05) * 2.5 + (x % 16 ? 4 : 0)); c.lineTo(0, GY); c.closePath(); c.fill();
  lanternV(130, 60, t, '#ffd27a'); lanternV(246, 80, t, '#ff9ab8');
  /* lianes qui pendent */ c.strokeStyle = '#3f8a4a'; c.lineWidth = 2; for (const [x, l] of [[44, 120], [236, 90], [334, 140]]) { const sw = Math.sin(t * .02 + x) * 6; c.beginPath(); c.moveTo(x, GY); c.quadraticCurveTo(x + sw, GY + l * .5, x + sw * 1.6, GY + l); c.stroke(); c.fillStyle = '#6ac86a'; for (let k = 1; k < 5; k++) { const yy = GY + l * k / 5; c.beginPath(); c.ellipse(x + sw * k / 5 * 1.4 + (k % 2 ? 4 : -4), yy, 4, 2.2, k % 2 ? .5 : -.5, 0, TAU); c.fill(); } }
  /* écureuil qui court la tête en bas */ { const x = ((t * .9) % (W + 60)) - 30, b = Math.abs(Math.sin(t * .3)) * 3; c.save(); c.translate(x, GY + 10 + b); c.fillStyle = '#d0784a'; c.beginPath(); c.ellipse(0, 0, 8, 5, 0, 0, TAU); c.fill(); c.beginPath(); c.arc(8, 3, 4.5, 0, TAU); c.fill(); c.beginPath(); c.ellipse(-10, 6, 5, 9, .6, 0, TAU); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(10, 4, 1.3, 0, TAU); c.fill(); c.fillStyle = '#1a1208'; c.beginPath(); c.arc(10.4, 4.2, .7, 0, TAU); c.fill(); c.restore(); }
  leavesUp(t, 12, ['#ff9a5a', '#ffd06a', '#ff7a8a']);
  for (let i = 0; i < 2; i++) { const x = ((h1(i * 7) * W + t * .5 * (1 + i * .4)) % (W + 60)) - 30; birdV(x, 430 + i * 36 + Math.sin(t * .02 + i) * 6, 1 - i * .15, t, i); }
  for (const [x, y, s, a] of [[300, 700, 1, .95], [130, 740, .8, .9], [40, 810, 1.1, 1], [250, 812, 1.2, 1]]) cloudV(x + Math.sin(t * .006 + x) * 8, y, s, a, t, '#fff4ec', 'rgba(255,170,190,0.45)');
  const px = 214; c.strokeStyle = '#8a5a6a'; c.lineWidth = 2; c.beginPath(); c.moveTo(px - 16, GY + 6); c.lineTo(px - 16, 200); c.moveTo(px + 16, GY + 6); c.lineTo(px + 16, 200); c.stroke(); plat(px, 202); }
/* ================= Zone 3 : le Ciel d'en bas (nuit) ================= */
function zoneN(t) {
  c.fillStyle = lg(GY, H, [[0, '#3a2a6a'], [.35, '#241a52'], [.75, '#141040'], [1, '#0c0a2e']]); c.fillRect(0, 0, W, H);
  /* étoiles sous nos pieds (plus nombreuses vers le bas, là où est le « haut » du ciel) */ for (let i = 0; i < 110; i++) { const x = h1(i) * W, y = 260 + Math.sqrt(h1(i * 3)) * (H - 260), a = .3 + .7 * Math.abs(Math.sin(t * .03 + i * 1.7)), r = .6 + h1(i * 5) * 1.4; c.fillStyle = `rgba(255,255,240,${a.toFixed(3)})`; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  /* étoile filante qui MONTE */ { const q = (t % 300) / 300; if (q < .18) { const k = q / .18, x = 260 - k * 160, y = 700 - k * 260; const g = c.createLinearGradient(x, y, x + 60, y + 100); g.addColorStop(0, `rgba(255,255,255,${(Math.sin(k * Math.PI)).toFixed(3)})`); g.addColorStop(1, 'rgba(255,255,255,0)'); c.strokeStyle = g; c.lineWidth = 2.4; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, y); c.lineTo(x + 60, y + 100); c.stroke(); } }
  /* la lune, en bas */ { const g = c.createRadialGradient(110, 740, 6, 110, 740, 170); g.addColorStop(0, 'rgba(220,230,255,0.55)'); g.addColorStop(1, 'rgba(200,210,255,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); c.fillStyle = '#f2f4ff'; c.beginPath(); c.arc(110, 740, 30, 0, TAU); c.fill(); c.fillStyle = 'rgba(170,180,230,0.4)'; for (const [dx, dy, r] of [[-8, -6, 6], [9, 7, 7], [-2, 12, 4]]) { c.beginPath(); c.arc(110 + dx, 740 + dy, r, 0, TAU); c.fill(); } }
  /* les montagnes renversées en silhouette, bord éclairé par la lune */ mountainsV(GY - 4, '#4a3a8a', '#352a6e', '#c8d0ff', 7, 3, 230, 300, 0); mountainsV(GY - 4, '#3a2e78', '#2a2260', '#aab4f0', 21, 4, 110, 170, 0);
  /* le sol-plafond, de nuit */ c.fillStyle = lg(0, GY + 10, [[0, '#14243a'], [.6, '#1e4a4a'], [1, '#2e6a5a']]); c.beginPath(); c.moveTo(0, 0); c.lineTo(W, 0); c.lineTo(W, GY); for (let x = W; x >= 0; x -= 8) c.lineTo(x, GY + Math.sin(x * .05) * 2.5 + (x % 16 ? 4 : 0)); c.lineTo(0, GY); c.closePath(); c.fill();
  /* le village de nuit : fenêtres allumées, guirlande */ treeV(24, .9, '#1e5a4a', '#3a8a6a'); houseV(70, 1.12, '#6a5a9a', '#3a2a6a', t, true); houseV(160, .92, '#5a6a9a', '#2a2a5a', t + 60, true); treeV(206, 1, '#1e5a4a', '#3a8a6a'); treeV(372, .8, '#1e5a4a', '#3a8a6a'); houseV(316, 1, '#7a5a9a', '#3a2a6a', t + 30, true);
  for (let i = 0; i < 9; i++) { const x = 30 + i * 40, y = GY + 30 + Math.sin(i * 1.2) * 6, on = .55 + .45 * Math.sin(t * .05 + i); const g = c.createRadialGradient(x, y, 1, x, y, 10); g.addColorStop(0, `rgba(255,220,140,${on.toFixed(3)})`); g.addColorStop(1, 'rgba(255,220,140,0)'); c.fillStyle = g; c.beginPath(); c.arc(x, y, 10, 0, TAU); c.fill(); c.fillStyle = '#ffe6a0'; c.beginPath(); c.arc(x, y, 2.2, 0, TAU); c.fill(); }
  c.strokeStyle = 'rgba(255,230,180,0.4)'; c.lineWidth = 1; c.beginPath(); for (let i = 0; i < 9; i++) { const x = 30 + i * 40, y = GY + 30 + Math.sin(i * 1.2) * 6; i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke();
  /* lucioles qui montent */ for (let i = 0; i < 14; i++) { const q = ((t * .003 + h1(i * 2)) % 1), x = h1(i) * W + Math.sin(q * 8 + i) * 14, y = 640 - q * 420, a = Math.sin(q * Math.PI); const g = c.createRadialGradient(x, y, 0, x, y, 8); g.addColorStop(0, `rgba(220,255,160,${(.8 * a).toFixed(3)})`); g.addColorStop(1, 'rgba(220,255,160,0)'); c.fillStyle = g; c.beginPath(); c.arc(x, y, 8, 0, TAU); c.fill(); }
  for (const [x, y, s, a] of [[290, 720, 1, .55], [70, 800, 1.2, .6], [300, 820, 1.1, .6]]) cloudV(x + Math.sin(t * .006 + x) * 8, y, s, a, t, '#9aa4e8', 'rgba(60,50,140,0.5)');
  const px = 250; c.strokeStyle = '#6a5a8a'; c.lineWidth = 2; c.beginPath(); c.moveTo(px - 16, GY + 40); c.lineTo(px - 16, 196); c.moveTo(px + 16, GY + 40); c.lineTo(px + 16, 196); c.stroke(); plat(px, 198); }

/* ================= B : le palais des glaces ================= */
function arch(x, y, w, h, frame, glass, a = 1) { c.save(); c.globalAlpha = a;
  const path = (k) => { c.beginPath(); c.moveTo(x - w / 2 * k, y); c.lineTo(x - w / 2 * k, y - h * k + w / 2 * k); c.arc(x, y - h * k + w / 2 * k, w / 2 * k, Math.PI, TAU); c.lineTo(x + w / 2 * k, y); c.closePath(); };
  c.fillStyle = frame; path(1.08); c.fill(); c.fillStyle = 'rgba(255,255,255,0.35)'; c.save(); path(1.08); c.clip(); c.fillRect(x - w, y - h * 1.2, w * .3, h * 1.3); c.restore();
  const g = c.createLinearGradient(x - w / 2, y - h, x + w / 2, y); g.addColorStop(0, glass[0]); g.addColorStop(1, glass[1]); c.fillStyle = g; path(.94); c.fill();
  c.save(); path(.94); c.clip(); c.fillStyle = 'rgba(255,255,255,0.35)'; c.beginPath(); c.moveTo(x - w * .5, y - h * .2); c.lineTo(x - w * .1, y - h); c.lineTo(x + w * .05, y - h); c.lineTo(x - w * .35, y - h * .1); c.fill(); c.restore(); c.restore(); }
function shard(x, y, s, a, t) { c.save(); c.translate(x, y); c.rotate(a + t * .01); c.scale(s, s); const g = c.createLinearGradient(-8, -10, 8, 10); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c8a8ff'); c.fillStyle = g; c.beginPath(); c.moveTo(0, -12); c.lineTo(8, 2); c.lineTo(-2, 12); c.lineTo(-7, -2); c.closePath(); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.8)'; c.beginPath(); c.moveTo(0, -12); c.lineTo(-7, -2); c.lineTo(-2, -2); c.fill(); c.restore(); }
function chandelier(x, y, s, t) { c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = '#e8c86a'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -80); c.lineTo(0, 0); c.stroke();
  c.fillStyle = '#f2c84a'; c.beginPath(); c.ellipse(0, 0, 50, 10, 0, 0, TAU); c.fill(); c.fillStyle = 'rgba(255,255,255,0.4)'; c.beginPath(); c.ellipse(-14, -3, 22, 3, 0, 0, TAU); c.fill();
  for (let i = -3; i <= 3; i++) { const x0 = i * 15, a = .6 + .4 * Math.sin(t * .05 + i); const g = c.createRadialGradient(x0, -18, 1, x0, -18, 16); g.addColorStop(0, `rgba(255,240,200,${a})`); g.addColorStop(1, 'rgba(255,220,160,0)'); c.fillStyle = g; c.beginPath(); c.arc(x0, -18, 16, 0, TAU); c.fill(); c.fillStyle = '#fff6e0'; c.fillRect(x0 - 2, -16, 4, 14); c.fillStyle = '#ffd86a'; c.beginPath(); c.ellipse(x0, -19, 2.4, 4, 0, 0, TAU); c.fill();
    c.fillStyle = 'rgba(220,240,255,0.85)'; c.beginPath(); c.moveTo(x0, 6); c.lineTo(x0 + 3, 14 + Math.abs(i) * 2); c.lineTo(x0, 22 + Math.abs(i) * 2); c.lineTo(x0 - 3, 14 + Math.abs(i) * 2); c.fill(); } c.restore(); }
function zoneB(t) {
  c.fillStyle = lg(0, H, [[0, '#3a1a6a'], [.5, '#8a4ac8'], [1, '#f0a8e0']]); c.fillRect(0, 0, W, H);
  /* couloir de miroirs à l'infini : des arches emboîtées qui rapetissent vers le centre */
  for (let k = 7; k >= 0; k--) { const s = Math.pow(.78, k), a = .35 + .65 * (1 - k / 7); arch(W / 2, 480 + 300 * s * 0, 300 * s, 420 * s, k % 2 ? '#d8a8ff' : '#f2c84a', ['#b8c8ff', '#7a5ad8'], a); }
  /* reflet du ballon dans le miroir du fond : il est petit, il fait coucou (indice pour le secret) */
  { const s = Math.pow(.78, 5), y = 480 - 420 * s * .4; c.fillStyle = 'rgba(226,58,110,0.7)'; c.beginPath(); c.arc(W / 2, y, 7, 0, TAU); c.fill(); }
  /* miroirs déformants sur les côtés */
  arch(46, 760, 90, 360, '#f2c84a', ['#ffd0f0', '#a87ae0']); arch(344, 760, 90, 360, '#f2c84a', ['#c8f0ff', '#8a6ae0']);
  /* le sol en damier en perspective (en bas) */
  for (let r = 0; r < 8; r++) { const y0 = 640 + r * r * 3 + r * 12, y1 = 640 + (r + 1) * (r + 1) * 3 + (r + 1) * 12; for (let i = -6; i <= 6; i++) { const k0 = (y0 - 600) / 240, k1 = (y1 - 600) / 240; c.fillStyle = (i + r) % 2 ? 'rgba(255,255,255,0.75)' : 'rgba(120,70,190,0.75)';
    c.beginPath(); c.moveTo(W / 2 + i * 50 * k0, y0); c.lineTo(W / 2 + (i + 1) * 50 * k0, y0); c.lineTo(W / 2 + (i + 1) * 50 * k1, y1); c.lineTo(W / 2 + i * 50 * k1, y1); c.fill(); } }
  c.fillStyle = lg(600, 700, [[0, 'rgba(240,168,224,0.8)'], [1, 'rgba(240,168,224,0)']]); c.fillRect(0, 600, W, 100);
  chandelier(W / 2, 110, 1.1, t);
  for (let i = 0; i < 14; i++) shard(h1(i) * W, 180 + h1(i * 3) * 520 + Math.sin(t * .02 + i) * 8, .7 + h1(i * 5) * .8, h1(i * 7) * 6, t);
  /* la plateforme : un rebord de cristal au plafond, sous le lustre */
  plat(240, 210, true); }

/* plateforme au plafond (le ballon monte et vient s'y coller par-dessous) */
function plat(x, y, crystal) { const w = 50; if (crystal) { const g = c.createLinearGradient(x - w, 0, x + w, 0); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#a890f0'); c.fillStyle = g; c.beginPath(); c.moveTo(x - w / 2 - 6, y - 14); c.lineTo(x + w / 2 + 6, y - 14); c.lineTo(x + w / 2, y + 6); c.lineTo(x - w / 2, y + 6); c.fill(); }
  c.fillStyle = crystal ? '#e8d8ff' : '#ffe2f0'; c.beginPath(); c.roundRect(x - w / 2, y, w, 11, 5); c.fill(); c.fillStyle = '#f2b705'; c.beginPath(); c.roundRect(x - w * .17, y + 4, w * .34, 4, 2); c.fill(); }
function balloon(x, y, r, t) { y += Math.sin(t * .05) * 2; const g = c.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r * 1.05); g.addColorStop(0, '#ff8ab0'); g.addColorStop(.6, '#e23a6e'); g.addColorStop(1, '#6a1030'); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.7)'; c.beginPath(); c.ellipse(x - r * .38, y - r * .4, r * .16, r * .26, -.6, 0, TAU); c.fill(); c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(x, y + r); c.quadraticCurveTo(x + 10, y + r + 18, x + 2, y + r + 34); c.stroke();
  c.setLineDash([3, 5]); c.strokeStyle = 'rgba(255,255,255,0.5)'; c.beginPath(); c.moveTo(x, y - r - 6); c.lineTo(x, 230); c.stroke(); c.setLineDash([]); }
function chip(x, y, txt) { c.font = '800 13px Nunito'; const w = c.measureText(txt).width + 24; c.fillStyle = 'rgba(40,20,80,0.32)'; c.beginPath(); c.roundRect(x, y, w, 26, 13); c.fill(); c.fillStyle = '#ffffff'; c.textBaseline = 'middle'; c.fillText(txt, x + 12, y + 13); return w; }
function hud(name, levels) { c.fillStyle = 'rgba(255,255,255,0.9)'; c.beginPath(); c.roundRect(14, 14, 44, 44, 14); c.fill(); c.fillStyle = '#3a1a6a'; c.fillRect(30, 28, 4, 16); c.fillRect(38, 28, 4, 16);
  c.font = '44px "Lilita One"'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillStyle = '#ffffff'; c.strokeStyle = 'rgba(40,20,80,0.4)'; c.lineWidth = 4; c.strokeText('3', W / 2, 58); c.fillText('3', W / 2, 58); c.textAlign = 'left';
  c.fillStyle = 'rgba(255,255,255,0.9)'; c.beginPath(); c.roundRect(W - 100, 16, 86, 36, 18); c.fill(); c.fillStyle = '#f2b705'; c.beginPath(); c.arc(W - 80, 34, 8, 0, TAU); c.fill(); c.font = '800 16px Nunito'; c.fillStyle = '#3a1a6a'; c.textBaseline = 'middle'; c.fillText('480', W - 66, 35);
  let x = 96; x += chip(x, 70, 'Manche 2/7') + 8; chip(x, 70, '★★ à 17 pts');
  c.font = '18px "Lilita One"'; c.fillStyle = '#ffffff'; c.textAlign = 'center'; c.strokeStyle = 'rgba(40,20,80,0.45)'; c.lineWidth = 4; c.strokeText(name, W / 2, 560); c.fillText(name, W / 2, 560); c.font = '800 11px Nunito'; c.globalAlpha = .85; c.fillText(levels, W / 2, 578); c.globalAlpha = 1; c.textAlign = 'left'; }
function frame(t) { c.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (V === 'F') { zoneF(t); balloon(196, 640, 42, t); hud('La Forêt suspendue', 'NIVEAUX 4 À 6'); return; }
  if (V === 'NB') { zoneN(t); return; }
  if (V === 'N') { zoneN(t); balloon(196, 640, 42, t); hud('Le Ciel d’en bas', 'NIVEAUX 7 À 10'); return; }
  if (V === 'A') { zoneA(t); balloon(196, 640, 42, t); hud('Le Village renversé', 'A · LE MONDE À L’ENVERS'); }
  else { zoneB(t); balloon(196, 640, 42, t); hud('Le Hall des miroirs', 'B · LE PALAIS DES GLACES'); } }
Promise.all([document.fonts.load('44px "Lilita One"'), document.fonts.load('800 13px Nunito')]).then(() => { if (FIX != null) { frame(+FIX); window.__READY = 1; return; } let t = 0; (function loop() { frame(t++); requestAnimationFrame(loop); })(); });
