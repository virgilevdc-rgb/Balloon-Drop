<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquettes Miroir</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#1a1030}canvas{display:block;width:390px;height:844px}</style></head>
<body><canvas id="cv"></canvas>
<script>
/* Monde 7 « Le Miroir » : deux directions à comparer. Le ballon part d'en bas et MONTE vers la plateforme du plafond. */
const Q = new URLSearchParams(location.search), V = Q.get('v') || 'A', FIX = Q.get('t');
const W = 390, H = 844, TAU = Math.PI * 2, DPR = 2;
const cv = document.getElementById('cv'); cv.width = W * DPR; cv.height = H * DPR; const c = cv.getContext('2d');
const h1 = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const lg = (y0, y1, st) => { const g = c.createLinearGradient(0, y0, 0, y1); st.forEach(([o, col]) => g.addColorStop(o, col)); return g; };
const rgb = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };

/* ================= A : le monde à l'envers =================
   On dessine un paysage normal, puis on le retourne : le sol est au plafond, les maisons et les arbres pendent,
   la cascade REMONTE, les nuages et le soleil sont en bas. (La lumière est dessinée par en dessous pour être en haut à gauche une fois retournée.) */
function cloud(x, y, s, a) { c.save(); c.globalAlpha = a; c.fillStyle = '#ffffff'; for (const [dx, dy, r] of [[-30, 0, 20], [-8, -10, 26], [18, -4, 22], [38, 4, 16]]) { c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, TAU); c.fill(); }
  c.fillStyle = 'rgba(200,170,240,0.45)'; c.beginPath(); c.roundRect(x - 48 * s, y + 2 * s, 100 * s, 12 * s, 6 * s); c.fill(); c.restore(); }
function house(x, y, s, wall, roof) { c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = wall; c.fillRect(-20, -30, 40, 30); c.fillStyle = 'rgba(255,255,255,0.25)'; c.fillRect(-20, -30, 10, 30);
  c.fillStyle = roof; c.beginPath(); c.moveTo(-26, -28); c.lineTo(0, -52); c.lineTo(26, -28); c.fill(); c.fillStyle = 'rgba(255,255,255,0.25)'; c.beginPath(); c.moveTo(-26, -28); c.lineTo(0, -52); c.lineTo(-6, -30); c.fill();
  c.fillStyle = '#ffd86a'; c.fillRect(-12, -22, 9, 9); c.fillRect(4, -22, 9, 9); c.fillStyle = '#6a3a5a'; c.beginPath(); c.roundRect(-4, -14, 9, 14, [4, 4, 0, 0]); c.fill();
  c.fillStyle = '#8a6a8a'; c.fillRect(8, -50, 6, 12); c.restore(); }
function tree(x, y, s, col, hi) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#7a4a5a'; c.fillRect(-3, -24, 6, 24);
  for (const [dx, dy, r] of [[0, -40, 18], [-12, -30, 13], [12, -30, 13]]) { const g = c.createRadialGradient(dx - r * .3, dy + r * .4, 1, dx, dy, r); g.addColorStop(0, hi); g.addColorStop(1, col); c.fillStyle = g; c.beginPath(); c.arc(dx, dy, r, 0, TAU); c.fill(); } c.restore(); }
function zoneA(t) {
  /* le ciel normal (dessiné à l'endroit) : ici le haut deviendra le bas */
  c.save(); c.translate(0, H); c.scale(1, -1);
  c.fillStyle = lg(0, H, [[0, '#ffd8f0'], [.35, '#e8c4ff'], [.7, '#a890f0'], [1, '#7a68d8']]); c.fillRect(0, 0, W, H);
  /* soleil (en bas une fois retourné) */ const g = c.createRadialGradient(300, 150, 10, 300, 150, 220); g.addColorStop(0, 'rgba(255,240,200,0.9)'); g.addColorStop(1, 'rgba(255,220,240,0)'); c.fillStyle = g; c.fillRect(0, 0, W, 400);
  c.fillStyle = '#fff4d8'; c.beginPath(); c.arc(300, 150, 34, 0, TAU); c.fill();
  for (const [x, y, s, a] of [[90, 120, 1.1, .95], [250, 270, .8, .85], [60, 330, .6, .7], [330, 400, .7, .8]]) cloud(x + Math.sin(t * .01 + x) * 6, y, s, a);
  /* collines lointaines */ c.fillStyle = '#b8a0e8'; c.beginPath(); c.moveTo(0, 640); for (let x = 0; x <= W; x += 10) c.lineTo(x, 640 - 40 * Math.sin(x * .012 + 1) - 20 * Math.sin(x * .03)); c.lineTo(W, H); c.lineTo(0, H); c.fill();
  /* deuxième plan de collines, plus proche (avec arbres en silhouette) */ c.fillStyle = '#9a80e0'; c.beginPath(); c.moveTo(0, 700); for (let x = 0; x <= W; x += 10) c.lineTo(x, 690 - 26 * Math.sin(x * .02 + 3) - 10 * Math.sin(x * .05)); c.lineTo(W, H); c.lineTo(0, H); c.fill();
  for (let i = 0; i < 9; i++) { const x = 20 + i * 44 + h1(i) * 10, y = 690 - 26 * Math.sin(x * .02 + 3) - 10 * Math.sin(x * .05); c.fillStyle = '#8a70d4'; c.beginPath(); c.arc(x, y - 12, 12, 0, TAU); c.fill(); c.fillRect(x - 2, y - 4, 4, 8); }
  /* oiseaux qui volent sur le dos */ c.strokeStyle = 'rgba(80,50,140,0.7)'; c.lineWidth = 2; c.lineCap = 'round'; for (let i = 0; i < 3; i++) { const x = (h1(i * 4) * W + t * .5 * (i + 1)) % (W + 40) - 20, y = 470 + i * 34, f = Math.sin(t * .2 + i) * 4; c.beginPath(); c.moveTo(x - 8, y + f); c.quadraticCurveTo(x - 3, y - 4, x, y); c.quadraticCurveTo(x + 3, y - 4, x + 8, y + f); c.stroke(); }
  /* la falaise et la cascade (elle tombe ici… elle remontera une fois retourné) */
  c.fillStyle = '#9a7ad8'; c.beginPath(); c.moveTo(250, H); c.lineTo(255, 600); c.quadraticCurveTo(290, 570, 330, 590); c.lineTo(340, H); c.fill();
  const wx = 300, wtop = 590, wbot = 740; const wg = c.createLinearGradient(wx - 16, 0, wx + 16, 0); wg.addColorStop(0, 'rgba(200,240,255,0.85)'); wg.addColorStop(.5, '#ffffff'); wg.addColorStop(1, 'rgba(170,220,255,0.85)');
  c.fillStyle = wg; c.beginPath(); c.moveTo(wx - 10, wtop); c.lineTo(wx + 10, wtop); c.lineTo(wx + 16, wbot); c.lineTo(wx - 16, wbot); c.fill();
  c.strokeStyle = 'rgba(140,200,240,0.6)'; c.lineWidth = 1.5; for (let i = 0; i < 5; i++) { const xx = wx - 8 + i * 4, o = (t * 2 + i * 13) % 30; for (let y = wtop - 30 + o; y < wbot; y += 30) { c.beginPath(); c.moveTo(xx, Math.max(wtop, y)); c.lineTo(xx, Math.min(wbot, y + 14)); c.stroke(); } }
  /* le sol (au plafond une fois retourné) : un vrai bloc de terre, couches, cailloux, racines qui pendent (vers le bas une fois retourné) */
  c.fillStyle = lg(745, H, [[0, '#a86a5a'], [.4, '#8a4a5a'], [1, '#5a2a4a']]); c.beginPath(); c.moveTo(0, H); c.lineTo(0, 752); for (let x = 0; x <= W; x += 10) c.lineTo(x, 752 + Math.sin(x * .03) * 5); c.lineTo(W, H); c.fill();
  c.fillStyle = 'rgba(255,220,200,0.25)'; for (let i = 0; i < 14; i++) { c.beginPath(); c.ellipse(h1(i * 3) * W, 780 + h1(i * 5) * 50, 6 + h1(i) * 8, 3 + h1(i) * 3, 0, 0, TAU); c.fill(); }
  c.strokeStyle = '#7a3a4a'; c.lineWidth = 2.4; for (let i = 0; i < 10; i++) { const x = 20 + i * 38 + h1(i) * 12, l = 30 + h1(i * 7) * 40, sw = Math.sin(t * .02 + i) * 3; c.beginPath(); c.moveTo(x, 752); c.quadraticCurveTo(x + sw, 752 - l * .5, x + sw * 2, 752 - l); c.stroke(); }
  /* le sol (au plafond une fois retourné) : herbe, lac où tombe la cascade */
  c.fillStyle = lg(730, H, [[0, '#8ae07a'], [1, '#3a9a5a']]); c.beginPath(); c.moveTo(0, H); c.lineTo(0, 740); for (let x = 0; x <= W; x += 10) c.lineTo(x, 740 + Math.sin(x * .03) * 5); c.lineTo(W, H); c.fill();
  c.fillStyle = '#7ad0f0'; c.beginPath(); c.ellipse(300, 748, 60, 9, 0, 0, TAU); c.fill(); c.fillStyle = 'rgba(255,255,255,0.5)'; c.beginPath(); c.ellipse(286, 746, 26, 2.5, 0, 0, TAU); c.fill();
  for (let i = 0; i < 6; i++) { const q = ((t * .02 + i / 6) % 1); c.fillStyle = `rgba(255,255,255,${(.7 * (1 - q)).toFixed(3)})`; c.beginPath(); c.arc(300 + (h1(i) - .5) * 50, 742 - q * 16, 3 + q * 4, 0, TAU); c.fill(); }
  house(70, 742, 1.15, '#ffb4c8', '#a04a8a'); house(140, 744, .9, '#ffe2a0', '#6a5ad8'); tree(200, 744, 1, '#5ac06a', '#a8f08a'); tree(28, 742, .8, '#4aa860', '#9ae07a'); tree(370, 744, .9, '#5ac06a', '#a8f08a');
  /* petit bonhomme qui marche la tête en bas (un clin d'œil) */ { const x = 236 + Math.sin(t * .01) * 10; c.fillStyle = '#ff7a8a'; c.beginPath(); c.roundRect(x - 4, 726, 8, 12, 3); c.fill(); c.fillStyle = '#ffd8b0'; c.beginPath(); c.arc(x, 721, 5, 0, TAU); c.fill(); c.fillStyle = '#3a2a5a'; c.fillRect(x - 3, 738, 2, 5); c.fillRect(x + 1, 738, 2, 5); }
  /* gouttes de la cascade qui s'échappent vers le haut (vers le bas avant retournement) */ for (let i = 0; i < 10; i++) { const q = ((t * .01 + i / 10) % 1); c.fillStyle = `rgba(220,245,255,${(.8 * (1 - q)).toFixed(3)})`; c.beginPath(); c.ellipse(300 + (h1(i) - .5) * 40, 590 - q * 160, 2, 3.5, 0, 0, TAU); c.fill(); }
  c.restore();
  /* la plateforme pend du sol-plafond, sur une corde */
  const px = 150; c.strokeStyle = '#7a4a5a'; c.lineWidth = 2; c.beginPath(); c.moveTo(px - 16, 104); c.lineTo(px - 16, 172); c.moveTo(px + 16, 104); c.lineTo(px + 16, 172); c.stroke();
  plat(px, 178); }

/* ================= B : le palais des glaces ================= */
function arch(x, y, w, h, frame, glass, a = 1) { c.save(); c.globalAlpha = a;
  const path = (k) => { c.beginPath(); c.moveTo(x - w / 2 * k, y); c.lineTo(x - w / 2 * k, y - h * k + w / 2 * k); c.arc(x, y - h * k + w / 2 * k, w / 2 * k, Math.PI, TAU); c.lineTo(x + w / 2 * k, y); c.closePath(); };
  c.fillStyle = frame; path(1.08); c.fill(); c.fillStyle = 'rgba(255,255,255,0.35)'; c.save(); path(1.08); c.clip(); c.fillRect(x - w, y - h * 1.2, w * .3, h * 1.3); c.restore();
  const g = c.createLinearGradient(x - w / 2, y - h, x + w / 2, y); g.addColorStop(0, glass[0]); g.addColorStop(1, glass[1]); c.fillStyle = g; path(.94); c.fill();
  c.save(); path(.94); c.clip(); c.fillStyle = 'rgba(255,255,255,0.35)'; c.beginPath(); c.moveTo(x - w * .5, y - h * .2); c.lineTo(x - w * .1, y - h); c.lineTo(x + w * .05, y - h); c.lineTo(x - w * .35, y - h * .1); c.fill(); c.restore(); c.restore(); }
function shard(x, y, s, a, t) { c.save(); c.translate(x, y); c.rotate(a + t * .01); c.scale(s, s); const g = c.createLinearGradient(-8, -10, 8, 10); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c8a8ff'); c.fillStyle = g; c.beginPath(); c.moveTo(0, -12); c.lineTo(8, 2); c.lineTo(-2, 12); c.lineTo(-7, -2); c.closePath(); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.8)'; c.beginPath(); c.moveTo(0, -12); c.lineTo(-7, -2); c.lineTo(-2, -2); c.fill(); c.restore(); }
function chandelier(x, y, s, t) { c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = '#e8c86a'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -80); c.lineTo(0, 0); c.stroke();
  c.fillStyle = '#f2c84a'; c.beginPath(); c.ellipse(0, 0, 50, 10, 0, 0, TAU); c.fill(); c.fillStyle = 'rgba(255,255,255,0.4)'; c.beginPath(); c.ellipse(-14, -3, 22, 3, 0, 0, TAU); c.fill();
  for (let i = -3; i <= 3; i++) { const x0 = i * 15, a = .6 + .4 * Math.sin(t * .05 + i); const g = c.createRadialGradient(x0, -18, 1, x0, -18, 16); g.addColorStop(0, `rgba(255,240,200,${a})`); g.addColorStop(1, 'rgba(255,220,160,0)'); c.fillStyle = g; c.beginPath(); c.arc(x0, -18, 16, 0, TAU); c.fill(); c.fillStyle = '#fff6e0'; c.fillRect(x0 - 2, -16, 4, 14); c.fillStyle = '#ffd86a'; c.beginPath(); c.ellipse(x0, -19, 2.4, 4, 0, 0, TAU); c.fill();
    c.fillStyle = 'rgba(220,240,255,0.85)'; c.beginPath(); c.moveTo(x0, 6); c.lineTo(x0 + 3, 14 + Math.abs(i) * 2); c.lineTo(x0, 22 + Math.abs(i) * 2); c.lineTo(x0 - 3, 14 + Math.abs(i) * 2); c.fill(); } c.restore(); }
function zoneB(t) {
  c.fillStyle = lg(0, H, [[0, '#3a1a6a'], [.5, '#8a4ac8'], [1, '#f0a8e0']]); c.fillRect(0, 0, W, H);
  /* couloir de miroirs à l'infini : des arches emboîtées qui rapetissent vers le centre */
  for (let k = 7; k >= 0; k--) { const s = Math.pow(.78, k), a = .35 + .65 * (1 - k / 7); arch(W / 2, 480 + 300 * s * 0, 300 * s, 420 * s, k % 2 ? '#d8a8ff' : '#f2c84a', ['#b8c8ff', '#7a5ad8'], a); }
  /* reflet du ballon dans le miroir du fond : il est petit, il fait coucou (indice pour le secret) */
  { const s = Math.pow(.78, 5), y = 480 - 420 * s * .4; c.fillStyle = 'rgba(226,58,110,0.7)'; c.beginPath(); c.arc(W / 2, y, 7, 0, TAU); c.fill(); }
  /* miroirs déformants sur les côtés */
  arch(46, 760, 90, 360, '#f2c84a', ['#ffd0f0', '#a87ae0']); arch(344, 760, 90, 360, '#f2c84a', ['#c8f0ff', '#8a6ae0']);
  /* le sol en damier en perspective (en bas) */
  for (let r = 0; r < 8; r++) { const y0 = 640 + r * r * 3 + r * 12, y1 = 640 + (r + 1) * (r + 1) * 3 + (r + 1) * 12; for (let i = -6; i <= 6; i++) { const k0 = (y0 - 600) / 240, k1 = (y1 - 600) / 240; c.fillStyle = (i + r) % 2 ? 'rgba(255,255,255,0.75)' : 'rgba(120,70,190,0.75)';
    c.beginPath(); c.moveTo(W / 2 + i * 50 * k0, y0); c.lineTo(W / 2 + (i + 1) * 50 * k0, y0); c.lineTo(W / 2 + (i + 1) * 50 * k1, y1); c.lineTo(W / 2 + i * 50 * k1, y1); c.fill(); } }
  c.fillStyle = lg(600, 700, [[0, 'rgba(240,168,224,0.8)'], [1, 'rgba(240,168,224,0)']]); c.fillRect(0, 600, W, 100);
  chandelier(W / 2, 110, 1.1, t);
  for (let i = 0; i < 14; i++) shard(h1(i) * W, 180 + h1(i * 3) * 520 + Math.sin(t * .02 + i) * 8, .7 + h1(i * 5) * .8, h1(i * 7) * 6, t);
  /* la plateforme : un rebord de cristal au plafond, sous le lustre */
  plat(240, 210, true); }

/* plateforme au plafond (le ballon monte et vient s'y coller par-dessous) */
function plat(x, y, crystal) { const w = 50; if (crystal) { const g = c.createLinearGradient(x - w, 0, x + w, 0); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#a890f0'); c.fillStyle = g; c.beginPath(); c.moveTo(x - w / 2 - 6, y - 14); c.lineTo(x + w / 2 + 6, y - 14); c.lineTo(x + w / 2, y + 6); c.lineTo(x - w / 2, y + 6); c.fill(); }
  c.fillStyle = crystal ? '#e8d8ff' : '#ffe2f0'; c.beginPath(); c.roundRect(x - w / 2, y, w, 11, 5); c.fill(); c.fillStyle = '#f2b705'; c.beginPath(); c.roundRect(x - w * .17, y + 4, w * .34, 4, 2); c.fill(); }
function balloon(x, y, r, t) { y += Math.sin(t * .05) * 2; const g = c.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r * 1.05); g.addColorStop(0, '#ff8ab0'); g.addColorStop(.6, '#e23a6e'); g.addColorStop(1, '#6a1030'); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.7)'; c.beginPath(); c.ellipse(x - r * .38, y - r * .4, r * .16, r * .26, -.6, 0, TAU); c.fill(); c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(x, y + r); c.quadraticCurveTo(x + 10, y + r + 18, x + 2, y + r + 34); c.stroke();
  c.setLineDash([3, 5]); c.strokeStyle = 'rgba(255,255,255,0.5)'; c.beginPath(); c.moveTo(x, y - r - 6); c.lineTo(x, 230); c.stroke(); c.setLineDash([]); }
function chip(x, y, txt) { c.font = '800 13px Nunito'; const w = c.measureText(txt).width + 24; c.fillStyle = 'rgba(40,20,80,0.32)'; c.beginPath(); c.roundRect(x, y, w, 26, 13); c.fill(); c.fillStyle = '#ffffff'; c.textBaseline = 'middle'; c.fillText(txt, x + 12, y + 13); return w; }
function hud(name, levels) { c.fillStyle = 'rgba(255,255,255,0.9)'; c.beginPath(); c.roundRect(14, 14, 44, 44, 14); c.fill(); c.fillStyle = '#3a1a6a'; c.fillRect(30, 28, 4, 16); c.fillRect(38, 28, 4, 16);
  c.font = '44px "Lilita One"'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillStyle = '#ffffff'; c.strokeStyle = 'rgba(40,20,80,0.4)'; c.lineWidth = 4; c.strokeText('3', W / 2, 58); c.fillText('3', W / 2, 58); c.textAlign = 'left';
  c.fillStyle = 'rgba(255,255,255,0.9)'; c.beginPath(); c.roundRect(W - 100, 16, 86, 36, 18); c.fill(); c.fillStyle = '#f2b705'; c.beginPath(); c.arc(W - 80, 34, 8, 0, TAU); c.fill(); c.font = '800 16px Nunito'; c.fillStyle = '#3a1a6a'; c.textBaseline = 'middle'; c.fillText('480', W - 66, 35);
  let x = 96; x += chip(x, 760, 'Manche 2/7') + 8; chip(x, 760, '★★ à 17 pts');
  c.font = '18px "Lilita One"'; c.fillStyle = '#ffffff'; c.textAlign = 'center'; c.strokeStyle = 'rgba(40,20,80,0.45)'; c.lineWidth = 4; c.strokeText(name, W / 2, 810); c.fillText(name, W / 2, 810); c.font = '800 11px Nunito'; c.globalAlpha = .85; c.fillText(levels, W / 2, 828); c.globalAlpha = 1; c.textAlign = 'left'; }
function frame(t) { c.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (V === 'A') { zoneA(t); balloon(196, 640, 42, t); hud('Le Village renversé', 'A · LE MONDE À L’ENVERS'); }
  else { zoneB(t); balloon(196, 640, 42, t); hud('Le Hall des miroirs', 'B · LE PALAIS DES GLACES'); } }
Promise.all([document.fonts.load('44px "Lilita One"'), document.fonts.load('800 13px Nunito')]).then(() => { if (FIX != null) { frame(+FIX); window.__READY = 1; return; } let t = 0; (function loop() { frame(t++); requestAnimationFrame(loop); })(); });
</script></body></html>
