<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Balloon Drop : pose le ballon sur la plateforme avant qu'il ne rétrécisse.">
<meta name="theme-color" content="#3f9ad6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balloon Drop">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Balloon Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Plein écran : le ciel est dessiné en canvas, l'interface flotte dessus ; les actions restent en bas, à portée du pouce */
:root {
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", ui-rounded, system-ui, sans-serif;
  --font-ui: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;

  --pink: #e8336d;  --pink-deep: #a8174a;  --on-pink: #ffffff;
  --gold: #f2b705;  --gold-deep: #b98200;  --on-gold: #4a3000;  --gold-text: #8a5a00;
  --ink: #14304f;   --ink-soft: #4d6888;   --focus: #14304f;
  --surface: #ffffff; --surface-2: #edf4fa; --line: #d3e1ee; --btn2-deep: #bfd2e6;
  --scrim: rgba(20, 48, 79, .32);
  --bg: #dff0fb;
  --logo: #14304f; --logo-shadow: #e8336d;
  --star-empty: #c9d6e3; --locked: #dfe8f1;
  --silver: #c9d3df; --bronze: #e6a873; --on-medal: #2a2a2a;
  --track: rgba(20, 48, 79, .14);
  --moon-a: #fbf6e4; --moon-b: #c9c3ad; --moon-ink: #3b3a55; --moon-glow: rgba(255, 255, 235, .5);
  --sunset-a: #463a80; --sunset-b: #b8577d; --sunset-c: #ffa47e; --sunset-deep: #2e2560; --on-sunset: #ffffff; --sunset-chip: rgba(255, 255, 255, .2);
  --hud-ink: #14304f; --hud-soft: #4d6888; --hud-chip: rgba(255, 255, 255, .72); --hud-gold: #8a5a00; --hud-shadow: rgba(255, 255, 255, .6); --path-line: rgba(255, 255, 255, .8);
  --is-dark: 0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pink: #ff4f86; --pink-deep: #b3245a;
    --gold-text: #ffd166;
    --ink: #eef3fa; --ink-soft: #a7b9d0; --focus: #ffffff;
    --surface: #15253d; --surface-2: #1d3150; --line: #0c1729; --btn2-deep: #0b1628;
    --scrim: rgba(0, 0, 0, .5);
    --bg: #0a1322;
    --logo: #ffffff; --logo-shadow: #c22a5e;
    --star-empty: #34496a; --locked: #22344f;
    --track: rgba(255, 255, 255, .16);
    --is-dark: 1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pink: #ff4f86; --pink-deep: #b3245a;
  --gold-text: #ffd166;
  --ink: #eef3fa; --ink-soft: #a7b9d0; --focus: #ffffff;
  --surface: #15253d; --surface-2: #1d3150; --line: #0c1729; --btn2-deep: #0b1628;
  --scrim: rgba(0, 0, 0, .5);
  --bg: #0a1322;
  --logo: #ffffff; --logo-shadow: #c22a5e;
  --star-empty: #34496a; --locked: #22344f;
  --track: rgba(255, 255, 255, .16);
  --is-dark: 1;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-weight: 700; font-size: 15px;
  -webkit-user-select: none; user-select: none; touch-action: none;
  -webkit-font-smoothing: antialiased;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#safeProbe { position: fixed; top: 0; left: 0; width: 1px; height: env(safe-area-inset-top, 0px); pointer-events: none; visibility: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
button:disabled { cursor: default; }
.logo, #score, #banner, .card h2, .sheet-head h2, .btn-big > span:first-child, .disc, .stat b, .mod b, .world-lock b { font-weight: 900; font-synthesis: none; }
svg { display: block; }

.coin {
  display: inline-block; width: 1.05em; height: 1.05em; border-radius: 50%; flex-shrink: 0;
  background: radial-gradient(circle at 35% 30%, #fff4b8 0 16%, #f7c531 42%, #c98d00 100%);
  box-shadow: inset 0 0 0 .09em #b07a00;
}

/* ---------- écrans ---------- */
.screen {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.home { pointer-events: none; }
.home > * { pointer-events: auto; }
.home > .home-space { pointer-events: none; }
.topbar { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; padding-top: 12px; }

.coin-pill {
  display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px;
  border-radius: 999px; background: var(--hud-chip); color: var(--hud-ink);
  font-weight: 900; font-size: 16px; font-variant-numeric: tabular-nums;
}
.coin-pill .glyph { color: var(--gold); font-size: 17px; line-height: 1; }
.coin-pill.bump .coin { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.45); } }

.icon-btn {
  width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
  background: var(--hud-chip); color: var(--hud-ink); flex-shrink: 0;
}
.icon-btn svg { width: 22px; height: 22px; }

.logo {
  font-family: var(--font-display); color: var(--logo);
  font-size: clamp(54px, 17vw, 84px); line-height: .86; letter-spacing: .01em; text-align: center;
  text-shadow: 0 .07em 0 var(--logo-shadow);
  margin-top: clamp(10px, 4vh, 40px); text-wrap: balance;
}
.home-space { flex: 1; min-height: 110px; width: 100%; }
.actions { width: 100%; max-width: 380px; display: grid; gap: 14px; padding-bottom: 20px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.btn {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-height: 56px; padding: 8px 14px; border-radius: 18px;
  font-weight: 900; font-size: 17px; line-height: 1.15;
  transition: transform .08s, box-shadow .08s;
}
.btn small { font-size: 12.5px; font-weight: 800; opacity: .78; }
.btn-primary { background: var(--pink); color: var(--on-pink); box-shadow: 0 5px 0 var(--pink-deep); }
.btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--pink-deep); }
.btn-secondary { background: var(--surface); color: var(--ink); box-shadow: 0 5px 0 var(--btn2-deep); }
.btn-secondary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--btn2-deep); }
.btn-big { min-height: 70px; }
.btn-big > span:first-child { font-family: var(--font-display); font-size: 28px; letter-spacing: .02em; line-height: 1; }

.top-right { display: flex; align-items: center; gap: 8px; }
.lvl-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 4px; border-radius: 999px; background: var(--hud-chip); color: var(--hud-ink); }
.lvl-num { min-width: 32px; height: 32px; padding: 0 4px; border-radius: 999px; display: grid; place-items: center; background: var(--pink); color: var(--on-pink); font-family: var(--font-display); font-weight: 900; font-synthesis: none; font-size: 17px; line-height: 1; font-variant-numeric: tabular-nums; }
.lvl-bar { width: 64px; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.lvl-bar i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: inherit; }
.home-card { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 96px; min-width: 0; padding: 12px; border-radius: 18px; text-align: left; transition: transform .08s, box-shadow .08s; }
.home-card.daily { background: linear-gradient(120deg, var(--sunset-a), var(--sunset-b) 62%, var(--sunset-c)); color: var(--on-sunset); box-shadow: 0 5px 0 var(--sunset-deep); }
.home-card.daily:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--sunset-deep); }
.home-card.missions { background: var(--surface); color: var(--ink); box-shadow: 0 5px 0 var(--btn2-deep); }
.home-card.missions:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--btn2-deep); }
.hc-top { display: flex; align-items: center; gap: 8px; max-width: 100%; }
.hc-top b { font-size: 15px; font-weight: 900; line-height: 1.1; white-space: nowrap; }
.home-card .sun { width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #fff3d6, #ffd08a 55%, #ff9f6e); box-shadow: 0 0 10px 2px rgba(255, 210, 150, .7); }
.ms-ic { width: 22px; height: 22px; flex-shrink: 0; color: var(--pink); }
.ms-ic svg { width: 22px; height: 22px; }
.hc-sub { font-size: 13px; font-weight: 800; opacity: .92; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-card.missions .hc-sub { color: var(--ink-soft); opacity: 1; }
.hc-chip { margin-top: auto; display: inline-flex; align-items: center; gap: 5px; background: var(--sunset-chip); border-radius: 999px; padding: 4px 10px; font-size: 13.5px; font-weight: 900; white-space: nowrap; }
.hc-dots { margin-top: auto; display: flex; gap: 6px; padding-bottom: 4px; }
.hc-dots i { width: 24px; height: 8px; border-radius: 999px; background: var(--track); }
.hc-dots i.on { background: var(--gold); }
.tabbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 6px; border-radius: 22px; background: var(--surface); box-shadow: 0 5px 0 var(--btn2-deep); }
.tabbar button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 54px; min-width: 0; border-radius: 16px; color: var(--ink); font-size: 12px; font-weight: 900; transition: background .12s; }
.tabbar button:active { background: var(--surface-2); }
.tabbar svg { width: 24px; height: 24px; }
.tabbar button span { font-size: clamp(10px, 2.75vw, 11.5px); white-space: nowrap; }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: var(--hud-chip); }
.mode { min-height: 38px; border-radius: 12px; color: var(--hud-ink); font-weight: 900; font-size: 15px; }
.mode[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--btn2-deep); }
.chip.time { color: var(--hud-ink); font-variant-numeric: tabular-nums; font-size: 14px; }
.chip.time.warn { background: var(--pink); color: #ffffff; animation: firePulse .5s ease-in-out infinite alternate; }
.tabs.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tabs.four .tab { font-size: 14.5px; }
.trophy-progress { width: 100%; max-width: 560px; margin-top: 14px; height: 10px; border-radius: 999px; background: var(--hud-chip); overflow: hidden; }
.trophy-progress i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: inherit; }
.trophy-list { flex: 1; width: 100%; max-width: 560px; overflow-y: auto; touch-action: pan-y; display: grid; gap: 10px; align-content: start; padding: 8px 3px 28px; scrollbar-width: none; }
.trophy-list::-webkit-scrollbar { display: none; }
.trophy-cat { font-family: var(--font-display); font-weight: 900; font-synthesis: none; font-size: 21px; line-height: 1.1; color: var(--hud-ink); text-shadow: 0 2px 0 var(--hud-shadow); padding: 10px 4px 0; }
.trophy-row { background: var(--surface); color: var(--ink); border-radius: 18px; padding: 11px 12px; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 12px; align-items: center; box-shadow: 0 4px 0 var(--btn2-deep); text-align: left; }
.trophy-row .ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--on-gold); }
.trophy-row .ic svg { width: 23px; height: 23px; }
.trophy-row.locked .ic { background: var(--locked); color: var(--ink-soft); }
.trophy-row b { display: block; font-size: 15px; font-weight: 900; line-height: 1.2; }
.trophy-row .t { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.35; }
.trophy-row .pr { margin-top: 6px; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.trophy-row .pr i { display: block; height: 100%; background: var(--gold); border-radius: inherit; }
.trophy-row .rw { display: inline-flex; align-items: center; gap: 4px; font-weight: 900; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.trophy-row .rw canvas { width: 34px; height: 34px; }
.trophy-row.done .rw { color: var(--gold-text); }
.reward svg { width: 20px; height: 20px; color: var(--gold-text); flex-shrink: 0; }
.coin-pill .cup { width: 18px; height: 18px; color: var(--gold); display: grid; }
.coin-pill .cup svg { width: 18px; height: 18px; }
.badge { position: absolute; top: 7px; left: calc(50% + 8px); width: 10px; height: 10px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 0 2px var(--surface); }

/* ---------- feuilles : aventure et boutique ---------- */
.sheet-head { width: 100%; max-width: 560px; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding-top: 12px; }
.sheet-head h2 { font-family: var(--font-display); font-size: 30px; color: var(--hud-ink); line-height: 1; text-shadow: 0 2px 0 var(--hud-shadow); }

.tabs { width: 100%; max-width: 560px; margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 18px; background: var(--hud-chip); }
.tab { min-height: 48px; border-radius: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--hud-ink); font-weight: 900; font-size: 16px; line-height: 1.1; }
.tab small { font-size: 12px; font-weight: 800; opacity: .8; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--btn2-deep); }
.world-desc { width: 100%; max-width: 560px; margin-top: 10px; text-align: center; color: var(--hud-soft); font-size: 14px; }

.story-scroll { flex: 1; width: 100%; max-width: 560px; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; margin-top: 4px; position: relative; scrollbar-width: none; }
.story-scroll::-webkit-scrollbar { display: none; }
.path { position: relative; width: 100%; }
.path > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.disc {
  width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface); color: var(--ink); box-shadow: 0 5px 0 var(--btn2-deep);
  font-family: var(--font-display); font-size: 27px; line-height: 1;
  transition: transform .08s, box-shadow .08s;
}
.node:active .disc { transform: translateY(3px); box-shadow: 0 2px 0 var(--btn2-deep); }
.node.boss .disc { width: 74px; height: 74px; font-size: 30px; box-shadow: 0 0 0 4px var(--gold), 0 6px 0 var(--btn2-deep); }
.node.current .disc { background: var(--pink); color: var(--on-pink); box-shadow: 0 5px 0 var(--pink-deep); }
.node.current.boss .disc { box-shadow: 0 0 0 4px var(--gold), 0 6px 0 var(--pink-deep); }
.node.current::before { content: ""; position: absolute; top: -6px; left: 50%; width: 74px; height: 74px; margin-left: -37px; border-radius: 50%; border: 3px solid var(--pink); animation: ring 1.6s ease-out infinite; pointer-events: none; }
.node.boss.current::before { width: 88px; height: 88px; margin-left: -44px; top: -7px; }
@keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.3); opacity: 0; } }
.node.locked .disc { background: var(--locked); color: var(--ink-soft); box-shadow: 0 5px 0 var(--btn2-deep); }
.node.locked .disc svg { width: 22px; height: 22px; }
.node-stars { font-size: 15px; letter-spacing: 1px; line-height: 1; color: var(--hud-ink); opacity: .35; }
.node-stars .on { color: var(--gold); }
.node-stars.has { opacity: 1; }
.node-stars .off { opacity: .35; }
.node-name { font-size: 12px; font-weight: 900; color: var(--hud-ink); background: var(--hud-chip); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.world-lock { position: sticky; top: 30%; margin: 0 auto; max-width: 300px; background: var(--surface); color: var(--ink); border-radius: 22px; padding: 18px; text-align: center; box-shadow: 0 6px 0 var(--btn2-deep); z-index: 2; }
.world-lock b { display: block; font-family: var(--font-display); font-size: 22px; margin-bottom: 4px; }
.world-lock p { color: var(--ink-soft); font-size: 14px; line-height: 1.4; }

.shop-note { width: 100%; max-width: 560px; margin-top: 10px; text-align: center; color: var(--hud-soft); font-size: 14px; line-height: 1.4; text-wrap: balance; }
.grid { flex: 1; width: 100%; max-width: 560px; margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-content: start; overflow-y: auto; touch-action: pan-y; padding: 4px 3px 28px; scrollbar-width: none; }
.grid::-webkit-scrollbar { display: none; }
.tile {
  background: var(--surface); color: var(--ink); border-radius: 20px; padding: 12px 8px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  box-shadow: 0 4px 0 var(--btn2-deep); transition: transform .08s, box-shadow .08s;
}
.tile:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--btn2-deep); }
.tile.selected { box-shadow: 0 0 0 3px var(--pink), 0 4px 0 var(--btn2-deep); }
.tile canvas { width: 66px; height: 66px; }
.tile .name { font-size: 13px; font-weight: 900; line-height: 1.15; min-height: 2.3em; display: flex; align-items: center; }
.tile .act { width: 100%; min-height: 32px; border-radius: 11px; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13.5px; font-weight: 900; padding: 0 4px; line-height: 1.1; }
.act.buy { background: var(--gold); color: var(--on-gold); }
.act.short { background: var(--surface-2); color: var(--ink-soft); }
.act.pick { background: var(--surface-2); color: var(--ink); }
.act.on { background: var(--pink); color: var(--on-pink); }
.act.lock { background: var(--surface-2); color: var(--ink-soft); font-size: 11.5px; font-weight: 800; }
.tile.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.tile.pop { animation: pop .4s; }
@keyframes pop { 40% { transform: scale(1.08); } }

/* ---------- jeu ---------- */
.hud {
  position: fixed; inset: 0 0 auto; pointer-events: none; color: var(--hud-ink);
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.hud-top { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
.hud-top .icon-btn { pointer-events: auto; }
.hud-top .coin-pill { justify-self: end; }
#score { font-family: var(--font-display); font-size: 62px; line-height: .95; text-align: center; font-variant-numeric: tabular-nums; text-shadow: 0 3px 0 var(--hud-shadow); transition: transform .15s; min-width: 2ch; }
#score.bump { transform: scale(1.22); }
.chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; padding: 0 40px; }
.chip { background: var(--hud-chip); color: var(--hud-soft); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 900; white-space: nowrap; }
.chip.gold { color: var(--hud-gold); }
.chip.strong { color: var(--hud-ink); }
.chip:empty { display: none; }
.chip.fire { color: #ffffff; background: linear-gradient(90deg, #ff7a1a, #e8336d); animation: firePulse .55s ease-in-out infinite alternate; }
@keyframes firePulse { from { transform: scale(1); } to { transform: scale(1.08); } }

#banner {
  position: fixed; left: 0; right: 0; top: 50%; text-align: center; pointer-events: none;
  font-family: var(--font-display); font-size: 34px; line-height: 1.05; color: var(--hud-ink);
  text-shadow: 0 3px 0 var(--hud-shadow); padding: 0 24px;
  opacity: 0; transform: scale(.85); transition: opacity .25s, transform .25s;
}
#banner small { display: block; font-family: var(--font-ui); font-size: 15px; font-weight: 800; color: var(--hud-soft); margin-top: 6px; text-shadow: none; }
#banner.show { opacity: 1; transform: scale(1); }
#hint {
  position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  text-align: center; pointer-events: none; color: var(--hud-ink); font-size: 15px; font-weight: 800;
  padding: 0 24px; transition: opacity .4s;
}
#hint span { background: var(--hud-chip); padding: 8px 14px; border-radius: 999px; display: inline-block; }

/* ---------- fenêtres ---------- */
.modal {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; overflow-y: auto; touch-action: pan-y;
  background: var(--scrim);
  padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: 100%; max-width: 352px; background: var(--surface); color: var(--ink); margin: auto 0; flex-shrink: 0;
  border-radius: 30px; padding: 24px 20px 20px; text-align: center;
  box-shadow: 0 8px 0 var(--btn2-deep);
  animation: cardIn .28s cubic-bezier(.2, 1.4, .4, 1);
}
@keyframes cardIn { from { transform: scale(.9); opacity: 0; } }
.card .kicker { font-size: 13px; font-weight: 900; color: var(--ink-soft); margin-bottom: 4px; }
.card h2 { font-family: var(--font-display); font-size: 36px; line-height: 1; text-wrap: balance; }
.card .sub { color: var(--ink-soft); font-size: 15px; line-height: 1.4; margin-top: 8px; text-wrap: pretty; }
.card .btns { display: grid; gap: 12px; margin-top: 20px; }
.card .btns.two { grid-template-columns: 1fr 1fr; }
.card .btn-secondary { background: var(--surface-2); }
.targets { margin-top: 16px; background: var(--surface-2); border-radius: 18px; padding: 6px 14px; text-align: left; }
.targets div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; font-size: 14.5px; }
.targets div + div { border-top: 1px solid var(--line); }
.targets b { font-weight: 900; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 5px; text-align: right; }
.targets .st { color: var(--gold); letter-spacing: 1px; font-size: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.stat { background: var(--surface-2); border-radius: 16px; padding: 10px 4px; }
.stat b { display: flex; align-items: center; justify-content: center; gap: 5px; font-family: var(--font-display); font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat b .coin { font-size: 18px; }
.stat span { font-size: 12px; color: var(--ink-soft); font-weight: 800; }
.bigstars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin-top: 12px; height: 70px; }
.bigstars span { font-size: 50px; line-height: 1; color: var(--star-empty); transition: transform .3s cubic-bezier(.2, 1.8, .4, 1), color .2s; }
.bigstars span:nth-child(2) { font-size: 64px; }
.bigstars span.on { color: var(--gold); transform: scale(1.12); }
.reward { margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: left; background: var(--surface-2); border-radius: 16px; padding: 12px; font-weight: 900; font-size: 17px; }
.reward .coin { font-size: 20px; }
.progress { margin-top: 14px; height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--sunset-b), var(--sunset-c)); border-radius: inherit; }
.progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-soft); margin-top: 6px; font-variant-numeric: tabular-nums; }
.unlock { margin-top: 14px; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface-2); border-radius: 16px; padding: 10px 12px; }
.unlock canvas { width: 46px; height: 46px; flex-shrink: 0; }
.unlock b { display: block; font-size: 15px; }
.unlock span { font-size: 13px; color: var(--ink-soft); }
.mod { margin-top: 14px; border-radius: 18px; padding: 14px; color: var(--on-sunset); background: linear-gradient(110deg, var(--sunset-a), var(--sunset-b) 60%, var(--sunset-c)); }
.mod b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1.05; }
.mod span { font-size: 14px; opacity: .92; }
.share-text { margin-top: 12px; width: 100%; min-height: 84px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13px; padding: 10px; resize: none; -webkit-user-select: text; user-select: text; }
.sound-row { margin-top: 14px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.sound-row .btn { min-height: 44px; flex-direction: row; gap: 8px; padding: 0 16px; font-size: 15px; }
.sound-row svg { width: 20px; height: 20px; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: 16px;
  font-weight: 900; font-size: 14.5px; text-align: center; max-width: calc(100% - 32px);
  transition: opacity .25s, transform .25s; z-index: 50;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- v4 : secrets, codes, classement, duels ---------- */
.logo { -webkit-touch-callout: none; touch-action: none; }
.logo .w { display: inline-block; white-space: nowrap; }
.logo .l { display: inline-block; }
.tabs.three { grid-template-columns: 1fr 1fr 1fr; }
.pane { flex: 1; width: 100%; max-width: 560px; display: flex; flex-direction: column; min-height: 0; }
.code-row { display: flex; justify-content: center; margin-top: 10px; }
.btn-small { min-height: 40px; padding: 0 18px; border-radius: 14px; font-size: 14.5px; flex-direction: row; gap: 6px; }
.secrets { flex: 1; overflow-y: auto; touch-action: pan-y; display: grid; gap: 10px; align-content: start; padding: 12px 3px 28px; scrollbar-width: none; }
.secrets::-webkit-scrollbar, .rank-list::-webkit-scrollbar { display: none; }
.secret-row { background: var(--surface); color: var(--ink); border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; box-shadow: 0 4px 0 var(--btn2-deep); text-align: left; }
.secret-row .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: var(--on-gold); font-family: var(--font-display); font-size: 20px; line-height: 1; }
.secret-row.locked .ic { background: var(--locked); color: var(--ink-soft); }
.secret-row b { display: block; font-size: 15px; font-weight: 900; }
.secret-row span.t { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.35; }
.rank-list { flex: 1; width: 100%; max-width: 560px; overflow-y: auto; touch-action: pan-y; margin-top: 12px; display: grid; gap: 8px; align-content: start; padding: 2px 3px 12px; scrollbar-width: none; }
.rank { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: var(--surface); color: var(--ink); border-radius: 16px; padding: 9px 14px; min-height: 54px; box-shadow: 0 3px 0 var(--btn2-deep); }
.rank .pos { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--font-display); font-size: 17px; font-variant-numeric: tabular-nums; }
.rank.p1 .pos { background: var(--gold); color: var(--on-medal); }
.rank.p2 .pos { background: var(--silver); color: var(--on-medal); }
.rank.p3 .pos { background: var(--bronze); color: var(--on-medal); }
.rank .who { font-weight: 900; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .who small { display: block; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.rank .pts { font-family: var(--font-display); font-weight: 900; font-synthesis: none; font-size: 24px; font-variant-numeric: tabular-nums; }
.rank.me { box-shadow: 0 0 0 3px var(--pink), 0 3px 0 var(--btn2-deep); }
.rank-empty { background: var(--surface); color: var(--ink-soft); border-radius: 18px; padding: 20px 18px; text-align: center; line-height: 1.45; font-size: 14.5px; }
.rank-note { width: 100%; max-width: 560px; text-align: center; color: var(--hud-soft); font-size: 13px; line-height: 1.4; padding: 4px 8px 14px; text-wrap: pretty; }
.field { width: 100%; margin-top: 16px; min-height: 54px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 19px; font-weight: 900; padding: 0 16px; text-align: center; letter-spacing: .02em; -webkit-user-select: text; user-select: text; touch-action: manipulation; }
.field:focus { outline: none; border-color: var(--pink); }
.field::placeholder { color: var(--ink-soft); opacity: .7; }
.field-error { margin-top: 8px; color: var(--pink); font-size: 13.5px; min-height: 1.3em; line-height: 1.35; }
.field.shake { animation: shake .35s; }
.duel-board { margin-top: 14px; display: grid; gap: 6px; text-align: left; }
.duel-row { display: flex; justify-content: space-between; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.duel-row span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.duel-row.me { box-shadow: inset 0 0 0 2px var(--pink); }
.duel-row b { font-variant-numeric: tabular-nums; font-weight: 900; }
.card .note { margin-top: 12px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }
.bossbar { max-width: 360px; margin: 8px auto 0; padding: 0 46px; text-align: center; }
.bossbar b { display: block; font-family: var(--font-display); font-weight: 900; font-synthesis: none; font-size: 17px; line-height: 1.1; color: var(--hud-ink); text-shadow: 0 2px 0 var(--hud-shadow); }
.bb { margin-top: 5px; height: 13px; border-radius: 999px; background: var(--hud-chip); overflow: hidden; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .14); }
.bb i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #e8336d, #ff9f1c); border-radius: inherit; transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.node.boss .disc { overflow: hidden; }
.node.boss .disc canvas { width: 70px; height: 70px; }
.node.boss.locked .disc canvas { filter: grayscale(1) brightness(.85); opacity: .7; }
.node.reveal .disc { transform: scale(1.18); box-shadow: 0 0 0 5px var(--gold), 0 0 38px 12px rgba(255, 190, 60, .8), 0 6px 0 var(--btn2-deep); transition: transform .35s cubic-bezier(.2, 1.6, .4, 1), box-shadow .35s; }
.node.reveal .node-name { background: var(--gold); color: var(--on-gold); }
.boss-portrait { display: block; width: 150px; height: 120px; margin: 0 auto 4px; }
.tabs.three .tab { font-size: 15px; }
.node.secret .disc { background: radial-gradient(circle at 40% 35%, var(--moon-a), var(--moon-b)); color: var(--moon-ink); box-shadow: 0 0 22px 6px var(--moon-glow), 0 5px 0 var(--btn2-deep); }

/* ---------- v5 : niveau, missions, deuxième chance, boutique par thème ---------- */
.xp-box { margin-top: 14px; background: var(--surface-2); border-radius: 16px; padding: 10px 12px; text-align: left; }
.xp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; }
.xp-head b { font-weight: 900; color: var(--gold-text); font-variant-numeric: tabular-nums; }
.xp-track { margin-top: 7px; height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
.xp-track i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: inherit; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.xp-track.static i { transition: none; }
.mini-missions { margin-top: 10px; display: grid; gap: 6px; }
.mm { position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 8px 12px; font-size: 13.5px; text-align: left; }
.mm > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mm > b { font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.mm > i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--gold); }
.mm.done { box-shadow: inset 0 0 0 2px var(--gold); }
.mm.done > b { color: var(--gold-text); }
.mission-list { margin-top: 16px; display: grid; gap: 10px; text-align: left; }
.mission { background: var(--surface-2); border-radius: 16px; padding: 12px 14px; }
.mission-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.mission-top b { font-size: 15px; font-weight: 900; line-height: 1.25; }
.mission-top > span { display: inline-flex; align-items: center; gap: 4px; font-weight: 900; font-size: 14px; white-space: nowrap; }
.mission .xp-track { margin-top: 8px; height: 8px; }
.mission-meta { margin-top: 5px; font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.mission.done { box-shadow: inset 0 0 0 2px var(--gold); }
.mission.done .mission-top > span { color: var(--gold-text); }
.targets canvas { width: 28px; height: 28px; }
.countdown { margin-top: 18px; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.countdown i { display: block; height: 100%; background: var(--pink); border-radius: inherit; transform-origin: left center; animation: countdown 5s linear forwards; }
@keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.shop-sec { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 16px 4px 0; color: var(--hud-ink); }
.shop-sec:first-child { padding-top: 4px; }
.shop-sec h3 { font-family: var(--font-display); font-weight: 900; font-synthesis: none; font-size: 21px; line-height: 1.1; text-shadow: 0 2px 0 var(--hud-shadow); }
.shop-sec > span { font-size: 13px; font-weight: 900; color: var(--hud-soft); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.shop-sec > span.done { color: var(--hud-gold); }
.tile { position: relative; }
.tile .new { position: absolute; top: 8px; right: 8px; background: var(--pink); color: var(--on-pink); font-size: 10.5px; font-weight: 900; padding: 2px 7px; border-radius: 999px; }

@media (max-height: 640px) {
  .mode { min-height: 32px; font-size: 14px; }
  .home-card { min-height: 84px; padding: 10px 12px; }
  .tabbar button { min-height: 48px; }
  .logo { font-size: clamp(44px, 13vw, 64px); margin-top: 6px; }
  .btn-big { min-height: 60px; }
  .actions { gap: 11px; padding-bottom: 12px; }
}
/* ---------- v9 : transitions, boutons élastiques, résultats en cascade ---------- */
.screen.sc-right { animation: scRight .34s cubic-bezier(.2, .9, .3, 1); }
.screen.sc-up { animation: scUp .36s cubic-bezier(.2, .9, .3, 1); }
.screen.sc-fade { animation: scFade .3s ease-out; }
@keyframes scRight { from { transform: translateX(30%); opacity: 0; } }
@keyframes scUp { from { transform: translateY(16%); opacity: 0; } }
@keyframes scFade { from { opacity: 0; transform: scale(.985); } }
.btn, .home-card, .tile, .disc, .icon-btn, .coin-pill, .lvl-chip { transition: transform .32s cubic-bezier(.3, 1.9, .5, 1), box-shadow .08s; }
.btn:active, .home-card:active, .tile:active { transition: transform .06s, box-shadow .06s; }
.btn-primary:active, .btn-secondary:active { transform: translateY(3px) scale(.97); }
.home-card:active { transform: translateY(3px) scale(.97); }
.tabbar button, .mode, .tab, .icon-btn, .coin-pill, .lvl-chip { transition: transform .32s cubic-bezier(.3, 1.9, .5, 1), background .12s; }
.tabbar button:active, .mode:active, .tab:active, .icon-btn:active, .lvl-chip:active, button.coin-pill:active { transform: scale(.9); transition: transform .06s, background .12s; }
.card.cascade > :not(h2):not(.kicker):not(.confetto) { opacity: 0; animation: cascIn .4s cubic-bezier(.2, .9, .3, 1.25) forwards; }
.card.cascade .stat { opacity: 0; animation: cascPop .45s cubic-bezier(.2, 1.6, .4, 1) forwards; }
.card.cascade .stats { opacity: 1; animation: none; }
@keyframes cascIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes cascPop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
.confetto { position: absolute; top: 30%; left: 50%; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; animation: confettoFly 1.3s cubic-bezier(.15, .7, .4, 1) forwards; }
@keyframes confettoFly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
.card { position: relative; }
/* ---------- v8 : écran d'ouverture ---------- */
#splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 16px; background: linear-gradient(180deg, #3f9ad6 0%, #8fcbec 55%, #e3f3fc 100%); transition: opacity .45s; cursor: pointer; -webkit-user-select: none; user-select: none; }
#splash.out { opacity: 0; pointer-events: none; }
.sp-stage { position: relative; width: 200px; height: 214px; flex-shrink: 0; }
.sp-fall { position: absolute; left: 25px; top: 18px; width: 150px; height: 182px; animation: spDrop .7s cubic-bezier(.55, 0, .9, .55) both; }
.sp-ball { width: 150px; height: 182px; transform-origin: 50% 100%; animation: spSquash .55s .7s ease-out both; }
.sp-ball svg { width: 150px; height: 182px; display: block; }
#splash.pop .sp-ball { animation: spPop .25s ease-in forwards; }
.sp-plat { position: absolute; left: 40px; bottom: 0; width: 120px; height: 16px; border-radius: 8px; background: #14304f; }
.sp-plat::before { content: ""; position: absolute; left: 50%; top: 4px; width: 40px; height: 6px; margin-left: -20px; border-radius: 3px; background: #f2b705; }
.sp-logo { font-family: var(--font-display); font-weight: 900; font-synthesis: none; color: #14304f; text-align: center; line-height: .88; font-size: clamp(54px, 17vw, 88px); text-shadow: 0 .07em 0 #e8336d; margin-top: 6px; }
.sp-logo .w { display: block; white-space: nowrap; }
.sp-logo .l { display: inline-block; opacity: 0; animation: spLetter .5s cubic-bezier(.2, 1.7, .4, 1) both; }
.sp-tap { margin-top: 26px; opacity: 0; font-size: 18px; font-weight: 900; color: #14304f; background: rgba(255, 255, 255, .75); padding: 11px 22px; border-radius: 999px; animation: spTapIn .4s 2s both, spPulse .9s 2.4s ease-in-out infinite alternate; }
#splash.pop .sp-tap { visibility: hidden; }
@keyframes spDrop { from { transform: translateY(-110vh); } to { transform: none; } }
@keyframes spSquash { 0% { transform: none; } 30% { transform: scale(1.16, .84); } 60% { transform: scale(.95, 1.05); } 100% { transform: none; } }
@keyframes spLetter { from { opacity: 0; transform: translateY(-46px) scale(.3) rotate(-12deg); } to { opacity: 1; transform: none; } }
@keyframes spTapIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes spPulse { from { transform: scale(1); } to { transform: scale(1.07); } }
@keyframes spPop { 40% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
/* ---------- v10 : scénario unique ---------- */
#uniq { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); background: radial-gradient(ellipse at 50% 30%, rgba(40,10,60,0.86), rgba(4,4,16,0.96)); opacity: 0; transition: opacity .5s; overflow-y: auto; }
#uniq.show { opacity: 1; }
#uniq[hidden] { display: none; }
#uniq .uq-flash { position: absolute; inset: 0; background: #e6f6ff; opacity: 0; pointer-events: none; }
#uniq .uq-flash.go { animation: uqFlash .9s ease-out; }
@keyframes uqFlash { 0% { opacity: 0; } 6% { opacity: .95; } 14% { opacity: .1; } 20% { opacity: .7; } 100% { opacity: 0; } }
#uqCloud { width: 220px; height: 150px; flex-shrink: 0; }
.uq-win { position: relative; width: 100%; max-width: 352px; flex-shrink: 0; border-radius: 14px; padding: 16px 16px 14px; color: #dff6ff; text-align: left;
  background: linear-gradient(180deg, rgba(18,40,92,0.92), rgba(8,16,44,0.94)); border: 1.5px solid #5fd6ff;
  box-shadow: 0 0 0 1px rgba(95,214,255,0.25), 0 0 26px rgba(95,214,255,0.45), inset 0 0 22px rgba(95,214,255,0.18);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; transform-origin: 50% 50%; }
.uq-win::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px); }
.uq-win.open { animation: uqOpen .55s steps(1) both, uqGrow .55s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes uqOpen { 0% { opacity: 0; } 10% { opacity: 1; } 18% { opacity: .2; } 26% { opacity: 1; } 34% { opacity: .5; } 42% { opacity: 1; } }
@keyframes uqGrow { 0% { transform: scale(1, .04); } 55% { transform: scale(1.02, 1.03); } 100% { transform: scale(1, 1); } }

const MISSION_REWARD = [30, 50, 80];
function ensureMissions() {
  const today = dayKey();
  if (S.missions.date === today && S.missions.list.length === 3 && S.missions.list.every(m => MISSION_TYPES[m.t])) return;
  const rng = mulberry32(hashStr('missions:' + today)), keys = Object.keys(MISSION_TYPES), used = new Set(), list = [];
  for (let slot = 0; slot < 3; slot++) {
    let k = keys[0], guard = 0;
    do { k = keys[Math.floor(rng() * keys.length)]; guard++; } while ((used.has(k) || (k === 'daily' && slot > 0)) && guard < 60);
    used.add(k);
    const tiers = MISSION_TYPES[k].tiers;
    list.push({ t: k, n: tiers[Math.min(slot, tiers.length - 1)], p: 0, done: false, r: MISSION_REWARD[slot] });
  }
  S.missions = { date: today, list };
}
const missionText = m => MISSION_TYPES[m.t] ? MISSION_TYPES[m.t].text(m.n) : '';
function missionEvent(type, v = 1) {
  if (cfg && cfg.mode === 'zen' && G.phase !== 'menu') return;
  ensureMissions();
  for (const m of S.missions.list) {
    if (m.t !== type || m.done) continue;
    m.p = MISSION_TYPES[type].max ? Math.max(m.p, v) : m.p + v;
    if (m.p < m.n) continue;
    m.p = m.n; m.done = true;
    S.xp += 20; stat('missions');
    G.missionsDone.push(m);
    if (G.phase === 'play' && R) { gainCoins(m.r, PW / 2, H * .45); toast('Mission réussie : ' + missionText(m) + ', +' + m.r + ' pièces'); sfx.goal(); buzz([15, 30, 15]); }
    else S.coins += m.r;
  }

/* Une nouveauté à chaque manche : la plateforme glisse (2), le vent (3), les oiseaux (4), la manche bonus (5), le double ballon (6), puis tout se mélange */
function arcadeRound(L, rng, f) {
  if (L < 0) return { speed: 0, wind: 0, gust: false, dbl: false, birdEvery: 0, bonus: false };
  const still = L >= 6 && rng() < .2;
  const speed = f.moveEarly ? Math.min(3.2, .8 + L * .2) : L >= 1 && !still ? Math.min(3.2, .55 + (L - 1) * .17) : 0;
  const windOn = !!f.windy || L === 2 || (L >= 3 && rng() < Math.min(.7, .38 + L * .02));
  const wind = windOn ? Math.min(.2, (f.windy ? .065 : .045) + L * .008) * (rng() < .5 ? -1 : 1) : 0;
  const gust = windOn && L >= 6 && rng() < .35;
  const dbl = f.double ? (L >= 1 && rng() < .75) : (L === 5 || (L >= 6 && rng() < Math.min(.45, .22 + (L - 6) * .03)));
  const birdsOn = !!f.birds || L === 3 || (L >= 4 && rng() < Math.min(.75, .35 + (L - 4) * .05));
  const birdEvery = birdsOn ? Math.max(100, 230 - L * 5) : 0;
  const bonus = L >= 1 && rng() < .38;
  return { speed, wind, gust, dbl, birdEvery, bonus };
}
function storyRound(lv, L, rng) {
  const speed = lv.move ? Math.min(3.2, lv.move[0] + L * lv.move[1]) : 0;
  const windOn = !!lv.wind && rng() < (lv.windChance != null ? lv.windChance : 1);
  const wind = windOn ? (lv.wind + L * .004) * (rng() < .5 ? -1 : 1) : 0;
  const gust = windOn && !!lv.gust && rng() < .6;
  const dbl = !!lv.dbl && (lv.dbl >= 1 || L > 0) && rng() < lv.dbl;
  const birdEvery = lv.birds ? Math.max(100, lv.birds - L * 3) : 0;
  const bonus = !!lv.bonus && rng() < lv.bonus;
  const p = { speed, wind, gust, dbl, birdEvery, bonus, crumble: lv.crumble ? Math.max(150, lv.crumble - L * 6) : 0, tramp: !!lv.tramp && rng() < lv.tramp, geysers: lv.geysers || 0, embers: lv.embers ? Math.max(110, lv.embers - L * 4) : 0 };
  return G.boss ? bossRound(G.boss, p, rng) : p;
}

function zenRound(L, rng) {

function newRound() {
  if (cfg.mode === 'chrono' && G.ending) return;
  const L = G.round;
  const rng = cfg.rngFor(L);
  const p = cfg.round(L, rng);
  const pw = Math.max(32, PW * .11) * cfg.plat * (G.wide > 0 ? 1.7 : 1);

    R.plat2 = { x: left ? PW * .62 + rng() * (PW * .38 - gw / 2 - 24) : gw / 2 + 24 + rng() * (PW * .38 - gw / 2 - 24), w: gw, speed: 0, dir: 1, gold: true };

function surfaceFor(b) {
  const first = R.balls[0];

function checkLanding(b) {

  if (Math.abs(off) <= sf.perf) return land(b, true, sf.y, sf);

const lavaY = () => H - Math.max(44, H * .055);
function setupHazards(p) {
  const P = R.plat;
  if (p.crumble) R.crumble = { max: p.crumble, t: 0, st: 'ok', k: 0 };
  if (p.tramp) {
    const tw = Math.max(64, PW * .2), left = P.x > PW / 2, lo = tw / 2 + 16, hi = PW - tw / 2 - 16;
    R.tramp = { x: left ? lo + R.rng() * (PW * .3 - lo) : PW * .7 + R.rng() * (hi - PW * .7), w: tw, sq: 0 };
    if (left) P.lo = Math.max(P.w / 2 + 10, R.tramp.x + tw / 2 + P.w / 2 + 36);
    else P.hi = Math.min(PW - P.w / 2 - 10, R.tramp.x - tw / 2 - P.w / 2 - 36);
  }
  if (G.boss && G.boss.type === 'dragon') { if (G.boss.side > 0) P.hi = Math.min(PW - P.w / 2 - 10, PW - 120 - P.w / 2); else P.lo = Math.max(P.w / 2 + 10, 120 + P.w / 2); }
  if (P.lo != null || P.hi != null) P.x = clamp(P.x, P.lo != null ? P.lo : P.w / 2 + 10, P.hi != null ? P.hi : PW - P.w / 2 - 10);
  if (p.geysers) {
    const sides = p.geysers >= 2 ? [-1, 1] : [R.rng() < .5 ? -1 : 1];
    const period = 214 - Math.min(G.round, 10) * 3;
    const ph0 = Math.floor(R.rng() * period);
    R.geysers = sides.map(sd => ({ dx: sd * (P.w / 2 + 36), w: 38, period, on: 64, ph: ph0 }));
  }
  R.emberEvery = p.embers || 0; R.emberT = p.embers ? Math.round(p.embers * .3) : 0;
}
function updateCrumble() {
  const C = R.crumble, P = R.plat, ab = aimBall();
  const idle = ab && ab.enter >= 1 && R.balls.length === 1;
  if (C.st === 'ok') {
    if (!idle) return;
    C.t++;
    if (C.t === Math.round(C.max * .5)) sfx.crack();
    if (C.t >= C.max) {
      C.st = 'fall'; C.k = 0; sfx.rumble(); buzz(40); shake = reduceMotion ? 0 : 6;
      for (let i = 0; i < 14; i++) FX.particles.push({ x: P.x + (Math.random() - .5) * P.w, y: groundY() + 4, vx: (Math.random() - .5) * 3, vy: -Math.random() * 3, g: .3, drag: .98, life: 40, size: 3 + Math.random() * 4, color: sky().plinth, rot: Math.random() * 3, vr: .2, shape: 'rect' });
    }

    C.k += 1 / 38;
    if (C.k >= 1) {
      C.st = 'rise'; C.k = 0;
      const lo = P.lo != null ? P.lo : P.w / 2 + 24, hi = P.hi != null ? P.hi : PW - P.w / 2 - 24;
      let nx = lo + Math.random() * Math.max(1, hi - lo);

function trampoline(b, off, sf) {

  T.sq = 1; sfx.tramp(); buzz(14);

    let x = P.x, dir = P.dir;
    for (let i = 0; i < n; i++) { let dx = P.speed * dir; if (x + dx < lo || x + dx > hi) { dir *= -1; dx = -dx; } x = clamp(x + dx, lo, hi); }

const geyserPhase = (g, f = 0) => (G.frame + f + g.ph) % g.period;
const geyserOn = (g, f = 0) => geyserPhase(g, f) < g.on;
const geyserX = g => clamp(R.plat.x + g.dx, 18, PW - 18);
function spawnEmber() { FX.embers.push({ x: 24 + R.rng() * (PW - 48), y: H + 12, vy: -(2 + R.rng() * .8), ph: R.rng() * 100 }); }
function hazardHit(b) {

      b.vy = Math.max(-5, b.vy - .95); b.vx += Math.sign(b.x - gx || 1) * .11;

      if (!b.steamed) { b.steamed = 1; floatText('Pschhh !', b.x, b.y - b.r - 16, 22, 'ink'); sfx.gust(); }
    }

  const B = G.boss;
  if (B && !B.dead) {

      b.crowHit = true; b.vx += Math.sign(b.x - B.x || 1) * 1.6; b.vy *= .7;

  }

}

let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(100, now - last) * (G.phase === 'play' ? timeScale(now) : 1); last = now;

}

/* Résultats en cascade : les blocs arrivent l'un après l'autre, les chiffres comptent, confettis si c'est un exploit */
function cascadeResults(res) {
  const card = $('card');
  if (!card || reduceMotion) return;
  card.classList.add('cascade');
  let d = .15;
  for (const ch of card.children) {
    if (ch.matches('h2, .kicker')) continue;
    if (ch.classList.contains('stats')) {
      ch.querySelectorAll('.stat').forEach((st, i) => { st.style.animationDelay = (d + i * .12).toFixed(2) + 's'; countUp(st.querySelector('b'), (d + i * .12) * 1000); });
      d += .45;
    } else { ch.style.animationDelay = d.toFixed(2) + 's'; d += .1; }
  }
  const big = res.record || res.dayRecord || res.reward || (res.win && res.stars === 3) || (cfg && cfg.mode === 'duel' && cfg.duel.target != null && G.score > cfg.duel.target);
  if (big) setTimeout(() => confettiDom(card), 500);
}
function countUp(b, delay) {
  if (!b) return;
  const tn = [...b.childNodes].reverse().find(n => n.nodeType === 3 && /\d/.test(n.textContent));
  if (!tn) return;
  const m = tn.textContent.match(/^(\D*)(\d+)(\D*)$/);
  if (!m) return;
  const target = +m[2], t0 = performance.now() + delay, dur = 700;
  tn.textContent = m[1] + '0' + m[3];
  const step = now => {
    const k = clamp((now - t0) / dur, 0, 1);
    tn.textContent = m[1] + Math.round(target * (1 - Math.pow(1 - k, 3))) + m[3];
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function confettiDom(card) {
  if (!card.isConnected) return;
  sfx.goal();
  for (let i = 0; i < 36; i++) {
    const c = document.createElement('i'); c.className = 'confetto';
    const a = Math.random() * TAU, r = 120 + Math.random() * 160;
    c.style.background = CONFETTI[i % CONFETTI.length];
    c.style.setProperty('--dx', Math.round(Math.cos(a) * r) + 'px');
    c.style.setProperty('--dy', Math.round(Math.sin(a) * r * .8 + 120) + 'px');
    c.style.setProperty('--rot', Math.round(Math.random() * 720 - 360) + 'deg');
    c.style.animationDelay = (Math.random() * .15).toFixed(2) + 's';
    card.appendChild(c);
    setTimeout(() => c.remove(), 1600);
  }
}

  if (sp) { const a = pts[pts.length - 1], my = (a.y + sp.y) / 2; d += ` C${a.x} ${my} ${sp.x} ${my} ${sp.x} ${sp.y}`; }
  const open = worldOpen(storyWorld);

  if (open) for (let i = 0; i < world.levels.length; i++) if (levelOpen(storyWorld, i) && !starsOf(storyWorld, i)) { current = i; break; }
  let html = `<svg viewBox="0 0 ${cw} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--path-line)" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/></svg>`;
  world.levels.forEach((lv, i) => {

      <span class="node-stars ${st ? 'has' : ''}">${stars}</span>

    html += `<button class="node secret" style="left:${sp.x}px;top:${sp.y}px" data-level="s" aria-label="Niveau secret, Au-dessus des nuages, ${st} étoiles"><span class="disc">☾</span><span class="node-stars ${st ? 'has' : ''}">${stars}</span><span class="node-name">Au-dessus des nuages</span></button>`;

/* Ouvrir un monde : la carte monte jusqu'au boss, s'y arrête, puis redescend au niveau en cours */
let revealRaf = 0;
function cancelReveal() {
  if (revealRaf) cancelAnimationFrame(revealRaf);
  revealRaf = 0;
  const n = $('path').querySelector('.node.reveal'); if (n) n.classList.remove('reveal');
}
function revealWorld(targetY) {
  const wrap = $('storyScroll'), boss = $('path').querySelector('.node.boss');
  const end = Math.max(0, targetY - wrap.clientHeight * .45);
  if (!boss) { wrap.scrollTop = end; return; }
  const bossTop = Math.max(0, parseFloat(boss.style.top) - wrap.clientHeight * .32);
  const start = Math.max(end, wrap.scrollHeight - wrap.clientHeight);
  const legs = [[start, bossTop, 1000], [bossTop, bossTop, 900], [bossTop, end, 950]];
  let leg = 0, t0 = performance.now();
  wrap.scrollTop = start;
  const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const stop = () => { cancelReveal(); wrap.removeEventListener('pointerdown', stop); wrap.removeEventListener('wheel', stop); };
  wrap.addEventListener('pointerdown', stop); wrap.addEventListener('wheel', stop, { passive: true });
  const step = now => {
    const [a, b, d] = legs[leg], k = Math.min(1, (now - t0) / d);
    wrap.scrollTop = a + (b - a) * ease(k);
    if (k >= 1) {
      leg++; t0 = now;
      if (leg === 1) { boss.classList.add('reveal'); tone(110, 70, .5, 'sawtooth', .035); buzz(15); }
      if (leg === 2) boss.classList.remove('reveal');
      if (leg >= legs.length) { stop(); return; }
    }
    revealRaf = requestAnimationFrame(step);
  };
  revealRaf = requestAnimationFrame(step);
}

const PAGE_URL = location.origin + location.pathname.replace(/index\.html$/, '');
const NET = { db: null, uid: null, status: 'loading', readOnly: false, players: [], lastPushed: null, chain: Promise.resolve(), synced: false };
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const safeNum = v => { const n = Math.round(Number(v)); return Number.isFinite(n) ? clamp(n, 0, 99999) : 0; };
function stable(v) {
  if (v && typeof v === 'object' && !Array.isArray(v)) return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v);
}
function myDoc() {
  const today = dayKey(), daily = {}, duels = {};
  for (const [k, v] of Object.entries(S.dailyHist)) if (v > 0 && daysBetween(k, today) <= 13) daily[k] = v;
  Object.entries(S.duels).sort((a, b) => b[1].t - a[1].t).slice(0, 30).forEach(([k, v]) => { duels[k] = { s: v.s }; });
  return { name: cleanName(S.pseudo), best: S.best || 0, chrono: S.bestChrono || 0, daily, duels, skin: S.skin, lvl: playerLevel() };
}
function remoteShape(p) {
  const daily = {}, duels = {};
  if (p.daily && typeof p.daily === 'object') for (const [k, v] of Object.entries(p.daily)) daily[k] = safeNum(v);
  if (p.duels && typeof p.duels === 'object') for (const [k, v] of Object.entries(p.duels)) duels[k] = { s: safeNum(v && v.s) };
  return { name: cleanName(p.name), best: safeNum(p.best), chrono: safeNum(p.chrono), daily, duels, skin: String(p.skin || ''), lvl: safeNum(p.lvl) };
}
function adoptRemote(p) {
  const r = remoteShape(p);
  let changed = false;
  if (!S.pseudo && r.name) { S.pseudo = r.name; changed = true; }
  if (r.best > (S.best || 0)) { S.best = r.best; changed = true; }
  if (r.chrono > (S.bestChrono || 0)) { S.bestChrono = r.chrono; changed = true; }
  for (const [k, v] of Object.entries(r.daily)) if (v > (S.dailyHist[k] || 0)) { S.dailyHist[k] = v; changed = true; }
  for (const [k, v] of Object.entries(r.duels)) if (!S.duels[k] || v.s > S.duels[k].s) { S.duels[k] = { s: v.s, t: S.duels[k] ? S.duels[k].t : 0 }; changed = true; }
  if (changed) { save(); if (screen === 'home') refreshHome(); }
}
async function initNet() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') { NET.status = 'off'; return; }
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { NET.status = 'off'; return; }
    NET.db = db; NET.uid = uid;
    db.collection('scores').limit(500).onSnapshot(snap => {
      NET.players = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data()));
      NET.status = 'on';
      if (!NET.synced) {
        NET.synced = true;
        const mine = NET.players.find(p => p.id === NET.uid);
        if (mine) { adoptRemote(mine); NET.lastPushed = stable(remoteShape(mine)); }
        const doc = myDoc();
        if (mine || doc.best || Object.keys(doc.daily).length || Object.keys(doc.duels).length) pushScores();
      }
      onNetChange();
    }, err => { NET.status = err && err.code === 'revoked' ? 'off' : 'error'; onNetChange(); });
  } catch (e) {
    NET.status = 'off';
  } finally {
    onNetChange();
  }
}
function pushScores() {
  if (!NET.db || !NET.uid || NET.readOnly) return;
  NET.chain = NET.chain.then(async () => {
    const body = myDoc(), key = stable(body);
    if (key === NET.lastPushed) return;
    const write = () => NET.db.doc('scores/' + NET.uid).set(Object.assign({}, body, { at: Date.now() }));
    try { await write(); NET.lastPushed = key; }
    catch (e) {
      const code = e && e.code;
      if (code === 'unavailable') {
        await new Promise(r => setTimeout(r, 700 + Math.random() * 900));
        try { await write(); NET.lastPushed = key; } catch (e2) {}
      } else if (code === 'quota_exceeded') {
        toast("Le classement est plein : ton score n'a pas pu être enregistré.");
      } else if (code !== 'resource_exhausted') {

      }
    }

  });
}

}

/* ---------- Duels ---------- */
function newDuelId() { const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let id = ''; for (let i = 0; i < 6; i++) id += a[Math.floor(Math.random() * a.length)]; return id; }
function slugName(n) { return cleanName(n).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 16); }
function duelLink(id, score) { const slug = slugName(S.pseudo); return PAGE_URL + '#duel-' + id + '-' + score + (slug ? '-' + slug : ''); }
function parseDuelHash() {
  const m = /^#duel-([a-z0-9]{4,12})-(\d{1,5})(?:-([a-z0-9-]{1,32}))?$/.exec(location.hash || '');
  if (!m) return null;
  const from = m[3] ? m[3].replace(/-+/g, ' ').trim() : '';
  return { id: m[1], target: safeNum(m[2]), from: from ? from.charAt(0).toUpperCase() + from.slice(1) : 'Un pote' };
}
let handledHash = '';
function handleHash() {
  if (screen !== 'home' || G.phase !== 'menu' || !$('modal').hidden) return;
  const d = parseDuelHash();
  if (!d || location.hash === handledHash) return;
  handledHash = location.hash;
  showDuelInvite(d);
}
function copyText(text, card, okMsg) {
  const fallback = () => {
    const ta = card.querySelector('#shareText');
    if (ta) { ta.hidden = false; ta.value = text; ta.focus(); ta.select(); }
    toast('Copie le texte et envoie-le à ton pote');
  };
  try { navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback); } catch (e) { fallback(); }
}
function showDuelIntro() {
  openModal(`
    <div class="kicker">Duel</div>
    <h2>Défie un pote</h2>
    <p class="sub">Joue une partie, puis envoie le lien. Ton pote joue exactement la même : mêmes plateformes, même vent, mêmes oiseaux.</p>
    ${S.pseudo ? '' : '<input class="field" id="duelName" type="text" maxlength="16" autocomplete="nickname" spellcheck="false" aria-label="Ton pseudo" placeholder="Ton pseudo"><p class="field-error" id="duelErr" role="alert"></p>'}
    <div class="btns">
      <button class="btn btn-primary btn-big" data-act="go" data-focus><span>Jouer le duel</span></button>
      <button class="btn btn-secondary" data-act="back">Retour</button>
    </div>`, card => {
    on(card, '[data-act=go]', () => {
      const inp = card.querySelector('#duelName');
      if (inp) {
        const v = cleanName(inp.value);
        if (v.length < 2) { card.querySelector('#duelErr').textContent = 'Choisis un pseudo pour que ton pote sache qui le défie.'; sfx.nope(); inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); return; }
        S.pseudo = v; save(); pushScores();
      }
      startGame('duel', { duel: { id: newDuelId(), target: null, from: '' } });
    });
    on(card, '[data-act=back]', closeModal);
  });
}
function showDuelInvite(d) {
  const best = S.duels[d.id] ? S.duels[d.id].s : 0;
  openModal(`
    <div class="kicker">Duel</div>
    <h2 id="duelTitle"></h2>
    <p class="sub">Score à battre : ${d.target} points. Tu joues exactement la même partie.</p>
    ${best ? `<p class="sub">Ton meilleur score sur ce duel : ${best} points.</p>` : ''}
    <div class="btns">
      <button class="btn btn-primary btn-big" data-act="go" data-focus><span>Relever le défi</span></button>
      <button class="btn btn-secondary" data-act="back">Plus tard</button>
    </div>`, card => {
    card.querySelector('#duelTitle').textContent = d.from + ' te défie';
    on(card, '[data-act=go]', () => startGame('duel', { duel: d }));
    on(card, '[data-act=back]', closeModal);
  });
}
function showDuelResults(res, unl) {
  const d = cfg.duel, sc = G.score, best = res.duelBest;
  const title = d.target == null ? sc + ' points' : sc > d.target ? 'Duel gagné' : sc === d.target ? 'Égalité' : 'Duel perdu';
  const sub = d.target == null ? 'Envoie le lien à un pote : il jouera exactement la même partie.' : d.from + ' avait fait ' + d.target + ' points, toi ' + sc + '.';
  openModal(`
    <div class="kicker">Duel</div>
    <h2>${esc(title)}</h2>
    <p class="sub" id="duelSub"></p>
    <div class="duel-board" id="duelBoard"></div>
    ${unl}
    <textarea class="share-text" id="shareText" readonly hidden></textarea>
    <div class="btns">
      <button class="btn btn-primary btn-big" data-act="send" data-focus><span>${d.target == null ? 'Envoyer le défi' : 'Renvoyer le défi'}</span></button>
      <div class="btns two" style="margin-top:0">
        <button class="btn btn-secondary" data-act="home">Accueil</button>
        <button class="btn btn-secondary" data-act="again">Rejouer</button>
      </div>
    </div>
    <p class="note">Envoie le lien à ton pote : il jouera exactement la même partie, sur son téléphone.</p>`, card => {
    card.querySelector('#duelSub').textContent = sub;
    renderDuelBoard();
    on(card, '[data-act=send]', () => copyText((S.pseudo || 'Un pote') + ' te défie sur Balloon Drop : ' + best + ' points à battre.\n' + duelLink(d.id, best), card, 'Lien du duel copié, envoie-le à ton pote'));
    on(card, '[data-act=again]', () => startGame('duel', { duel: d }));
    on(card, '[data-act=home]', () => { closeModal(); showScreen('home'); });
    paintPreviews(card); animateXp(card);
  });
  if (d.target != null && sc > d.target) { sfx.goal(); buzz([20, 40, 20]); }
}
function renderDuelBoard() {
  const el = $('duelBoard');
  if (!el || !cfg || cfg.mode !== 'duel') return;
  const d = cfg.duel, rows = [];
  for (const p of NET.players) {
    if (p.id === NET.uid) continue;
    const r = remoteShape(p);
    if (r.duels[d.id]) rows.push({ name: r.name || 'Joueur', s: r.duels[d.id].s });
  }
  rows.push({ name: S.pseudo || 'Toi', s: S.duels[d.id] ? S.duels[d.id].s : G.score, me: true });
  if (d.target != null && !rows.some(r => !r.me && slugName(r.name) === slugName(d.from))) rows.push({ name: d.from, s: d.target });
  rows.sort((a, b) => b.s - a.s);
  el.innerHTML = '';
  rows.slice(0, 8).forEach(r => {
    const row = document.createElement('div'); row.className = 'duel-row' + (r.me ? ' me' : '');
    const n = document.createElement('span'); n.textContent = r.name + (r.me ? ' (toi)' : '');
    const b = document.createElement('b'); b.textContent = r.s + ' pts';
    row.append(n, b); el.appendChild(row);
  });
}

/* =========================================================
   Boutons et démarrage
   ========================================================= */
document.querySelectorAll('[data-home]').forEach(b => { b.innerHTML = ICONS.back; b.addEventListener('click', () => showScreen('home')); });
$('btnPause').innerHTML = ICONS.pause;
$('btnPause').addEventListener('click', pause);
$('btnPlay').addEventListener('click', () => startGame(S.lastMode === 'chrono' || S.lastMode === 'zen' ? S.lastMode : 'arcade'));
document.querySelectorAll('.mode').forEach(m => m.addEventListener('click', () => { audio(); S.lastMode = m.dataset.mode; save(); sfx.tap(2); refreshHome(); }));
$('btnTrophies').addEventListener('click', () => { audio(); showScreen('trophies'); });
$('btnDaily').addEventListener('click', () => { audio(); showDailyIntro(); });
$('btnStory').addEventListener('click', () => { audio(); let w = storyWorld; for (let k = WORLDS.length; k >= 1; k--) if (worldOpen(k) && worldStars(k) < 30 && (k > 1 ? starsOf(k - 1, 9) > 0 : true)) { w = k; break; } storyWorld = w; showScreen('story'); });
$('btnShop').addEventListener('click', () => { audio(); showScreen('shop'); });
$('muteHome').addEventListener('click', () => { S.muted = !S.muted; save(); setMuteIcons(); if (!S.muted) sfx.tap(); });
$('modal').addEventListener('click', e => { if (e.target === $('modal') && G.phase === 'paused') resume(); });

function onThemeChange() { readCss(); setView(view); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onThemeChange);
new MutationObserver(onThemeChange).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
addEventListener('resize', resize);

$('btnRanks').addEventListener('click', () => { audio(); showScreen('ranks'); });
$('btnMissions').addEventListener('click', () => { audio(); showMissionsModal(); });
$('lvlChip').addEventListener('click', () => { audio(); showLevelModal(); });
addEventListener('keydown', e => {
  if (G.phase !== 'over' || $('modal').hidden) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === 'Enter' || e.key === ' ') { const b = $('card').querySelector('[data-focus]'); if (b) { e.preventDefault(); b.click(); } }
});
$('btnDuel').addEventListener('click', () => { audio(); showDuelIntro(); });
$('btnCode').addEventListener('click', () => { audio(); showCodeModal(); });
$('tabSkins').addEventListener('click', () => setShopTab('skins'));
$('tabSecrets').addEventListener('click', () => setShopTab('secrets'));
for (const t of ['day', 'week', 'best', 'chrono']) $('rk-' + t).addEventListener('click', () => { rankTab = t; renderRanks(); });
$('pseudoBtn').addEventListener('click', () => showPseudoModal());
$('path').addEventListener('click', onPathTap);
addEventListener('hashchange', handleHash);
initLogo();

readCss();
resize();
if (checkUnlocks().length) save();
const bootThemes = checkThemes();
if (bootThemes.length) save();
const bootTrophies = checkTrophies(true);
if (checkUnlocks().length) save();
showScreen('home');
/* Écran d'ouverture : le ballon tombe, les lettres arrivent, puis « Touche pour jouer » (ce toucher débloque aussi le son) */
function afterSplash() {
  announceThemes(bootThemes);
  if (bootTrophies.length) setTimeout(() => announceTrophies(bootTrophies), bootThemes.length * 2600);
  handleHash();
}
(function splash() {
  const el = $('splash');
  if (window.__noSplash) { el.remove(); afterSplash(); return; }
  let i = 0;
  $('spLogo').innerHTML = ['Balloon', 'Drop'].map(w => '<span class="w">' + [...w].map(ch => '<span class="l" style="animation-delay:' + (0.75 + (i++) * 0.07).toFixed(2) + 's">' + ch + '</span>').join('') + '</span>').join('');
  let done = false;
  const go = () => {
    if (done) return; done = true;
    audio(); sfx.pop(); setTimeout(() => sfx.goal(), 140); buzz([15, 30, 15]);
    el.classList.add('pop');
    setTimeout(() => el.classList.add('out'), 220);
    setTimeout(() => { el.remove(); homeEnter = 0; afterSplash(); }, 700);
  };
  el.addEventListener('pointerdown', go);
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  el.focus({ preventScroll: true });
})();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measureHome(); });
requestAnimationFrame(t => { last = t; frame(t); });
initNet();

})();
</script>

if ('serviceWorker' in navigator) addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
